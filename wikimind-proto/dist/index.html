<title>Warden: prototype variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F2;--panel:#FFFFFF;--ink:#1E2724;--ink2:#5E6A65;--line:#E3E7E2;--accent:#4353C6;--sh:0 1px 2px rgba(25,40,32,.06),0 4px 14px rgba(25,40,32,.06);
 --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--panel:#1B201E;--ink:#ECEFEC;--ink2:#A1ACA7;--line:#2C3431;--accent:#9EA9FF;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121614;--panel:#1B201E;--ink:#ECEFEC;--ink2:#A1ACA7;--line:#2C3431;--accent:#9EA9FF;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg{flex:1;display:flex;gap:4px;background:var(--line);padding:3px;border-radius:999px;overflow-x:auto;scrollbar-width:none;max-width:560px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:max-content;border:0;background:none;color:var(--ink2);font:inherit;border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button b{font-size:13.5px;font-weight:600}
.seg button span{font-size:11px;font-weight:500;opacity:.8}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
iframe.on{display:block}
@media (max-width:520px){.lbl{display:none}.seg button span{display:none}.seg button{padding:8px 12px}}
</style>
</head>
