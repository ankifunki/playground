<style>
:root{
 --bg:#F7F8F6;--panel:#FFFFFF;--soft:#F0F2EF;--soft2:#E8EBE7;--ink:#17201C;--ink2:#5B6661;--line:#E2E6E1;--hair:#ECEFEB;
 --link:#4B45D6;--linkb:#ECEBFC;--ok:#1E8467;--okb:#E1F3EC;--warn:#B06E12;--warnb:#FCF0DA;--del:#B3302D;--delb:#FBE2E0;
 --sh:0 1px 2px rgba(20,30,25,.05),0 8px 24px rgba(20,30,25,.06);--sh2:0 1px 2px rgba(20,30,25,.06),0 14px 34px rgba(20,30,25,.1);
 --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Geist Serif",Georgia,"Times New Roman",serif;
 --eo:cubic-bezier(.23,1,.32,1);
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--panel:#191E1C;--soft:#212825;--soft2:#2A322F;--ink:#ECEFEC;--ink2:#A2ADA8;--line:#2B3330;--hair:#242B28;--link:#A9A5FF;--linkb:#26244A;--ok:#6FD3B4;--okb:#16362D;--warn:#F0C36B;--warnb:#3D3016;--del:#FF9A92;--delb:#44221F;--sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);--sh2:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111513;--panel:#191E1C;--soft:#212825;--soft2:#2A322F;--ink:#ECEFEC;--ink2:#A2ADA8;--line:#2B3330;--hair:#242B28;--link:#A9A5FF;--linkb:#26244A;--ok:#6FD3B4;--okb:#16362D;--warn:#F0C36B;--warnb:#3D3016;--del:#FF9A92;--delb:#44221F;--sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);--sh2:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.35);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wl{color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;font-weight:600}
.press{transition:transform .16s var(--eo),background-color .2s var(--eo),box-shadow .2s var(--eo)}
.press:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fresh{0%{background:var(--okb)}100%{background:transparent}}
@keyframes pd{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;position:relative;flex:none}
.pdot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:pd 2s ease-out infinite}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
header.sc{border-bottom-color:var(--line)}
.hw{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:14px;height:60px}
.logo{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;cursor:pointer;flex:none}
.mark{display:none}
.logo b{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:-.01em}
.logo small{font-size:13px;color:var(--ink2);font-weight:500}
.srch{flex:1;min-width:0;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--panel);box-shadow:var(--sh);border-radius:999px;padding:0 6px 0 16px;height:44px;margin-left:auto}
.srch input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);outline:none}
.srch button{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer}
@media (max-width:640px){.logo small{display:none}}
/* layout */
.page{max-width:1180px;margin:0 auto;padding:0 18px 130px}
@media (min-width:1080px){.page.art{display:grid;grid-template-columns:190px minmax(0,1fr);gap:44px}}
.toc{display:none}
@media (min-width:1080px){.toc{display:block;position:sticky;top:92px;align-self:start;padding-top:30px;font-size:14px}.toc h4{font-size:13px;color:var(--ink2);margin:0 0 10px;font-weight:700}.toc button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink2);padding:6px 10px;border-radius:10px;cursor:pointer;font-weight:500;transition:background-color .2s,color .2s}.toc button.on{color:var(--ink);background:var(--panel);box-shadow:var(--sh);font-weight:600}}
.tabs{display:inline-flex;gap:4px;background:var(--soft2);padding:4px;border-radius:999px;margin-top:20px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 15px;font-size:14px;font-weight:600;color:var(--ink2);border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background-color .2s,color .2s}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.tabs .cnt{background:var(--warnb);color:var(--warn);border-radius:999px;font-size:11.5px;padding:0 7px;font-weight:700}
h1.t{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5.5vw,48px);line-height:1.05;letter-spacing:-.02em;margin:18px 0 8px}
.byline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--ink2);margin-bottom:20px}
.byline .live{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-weight:600}
.byline .live .pdot{margin-left:4px}
.art-body{font-size:17px;line-height:1.7}
.art-body p{margin:0 0 16px}
#s-lead>p{font-family:var(--serif);font-size:21px;line-height:1.55}
#s-lead>p b{font-weight:600}
.art-body h2{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:-.015em;margin:40px 0 14px;display:flow-root}
.art-body h3{font-size:16px;font-weight:700;margin:24px 0 10px;display:flow-root}
sup.rf{font-size:11px;line-height:0;margin-left:3px;vertical-align:3px;white-space:nowrap}
sup.rf button{border:0;background:var(--linkb);color:var(--link);border-radius:999px;min-width:19px;height:19px;padding:0 5px;cursor:pointer;font:inherit;font-weight:700;line-height:19px;font-family:var(--sans);transition:transform .16s var(--eo),background-color .2s}
sup.rf button:active{transform:scale(.9)}
sup.rf.ck button{background:var(--warnb);color:var(--warn)}
.uns{text-decoration:underline dotted var(--warn);text-decoration-thickness:2px;text-underline-offset:5px}
.upd{animation:fresh 3s ease-out}
/* at a glance */
.ibox{background:var(--panel);box-shadow:var(--sh);border-radius:20px;padding:16px 18px;font-size:14.5px;margin:4px 0 22px;display:flow-root}
@media (min-width:760px){.ibox{float:right;width:310px;margin:8px 0 18px 28px}}
.ibox .ih{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 10px;font-family:var(--sans)}
.ibox .thumb{background:var(--soft);border-radius:12px;padding:8px 6px 4px;margin-bottom:6px}
.ibox .cap{font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.ibox table{width:100%;border-collapse:collapse}
.ibox th{text-align:left;vertical-align:top;font-weight:500;color:var(--ink2);padding:7px 10px 7px 0;width:44%;font-size:14px}
.ibox td{padding:7px 0;vertical-align:top;font-weight:500}
.ibox tr+tr th,.ibox tr+tr td{border-top:1px solid var(--hair)}
.tbar{height:6px;border-radius:999px;background:var(--soft2);overflow:hidden;margin:8px 0 6px;display:flex;gap:2px}
.tbar i{display:block;height:100%;border-radius:999px}
.ibox .trust{background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:10px}
.ibox .trust b{font-size:14px;font-weight:600}
.ibox .trust small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.5}
.spark rect{fill:var(--link);opacity:.45}.spark rect.now{opacity:1;animation:sp 1.6s ease-in-out infinite alternate}
@keyframes sp{from{opacity:.5}to{opacity:1}}
#s-lead{display:flex;flex-direction:column}
#s-lead>p{order:1}#s-lead>.ibox{order:2}#s-lead>.mtoc{order:3}
@media (min-width:760px){#s-lead{display:block}}
.mtoc{background:var(--panel);box-shadow:var(--sh);border-radius:16px;margin:0 0 18px;font-size:15px}
.mtoc summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none}
.mtoc summary::-webkit-details-marker{display:none}
.mtoc ol{margin:0;padding:0 16px 14px 36px}
.mtoc li{padding:3px 0}
@media (min-width:1080px){.mtoc{display:none}}
/* figures */
.fig{background:var(--panel);box-shadow:var(--sh);border-radius:20px;padding:14px 12px 10px;margin:6px 0 18px;display:flow-root}
.fig svg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.fig .fc{font-size:13px;color:var(--ink2);margin-top:6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 6px}
.nb{fill:var(--soft);stroke:var(--line)}
.nt{font:500 12.5px var(--sans);fill:var(--ink)}
.ns{font:500 11px var(--sans);fill:var(--ink2)}
.eg{fill:none;stroke:var(--line);stroke-width:2}
.rp{background:var(--panel);box-shadow:var(--sh);border-radius:20px;padding:16px;font-size:13.5px;position:relative;overflow:hidden;display:flow-root}
.rp .rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:12px}
.rp .rh b{font-size:15.5px;font-weight:600}

 else h+='<p>'+esc(a.t)+rf(a.n)+'</p>'+(a.note?'<div class="note">'+esc(a.note)+'</div>':'')+'<div class="src">'+(a.pending?'Asoka is checking all of its sources…':a.src==='asoka'?'Answered by Asoka from the page’s sources. Tap a number to see it.':'From the page’s sources. Tap a number to see it.')+'</div>';
 h+='</div><div style="font-size:13.5px;font-weight:700;color:var(--ink2);margin:0 0 10px">Related pages</div><ul class="results"><li><button class="wl" data-act="open"><b>Opportunity approvals</b></button><small>How Northwind reviews large deals before Negotiation. 5 of 8 statements verified.</small></li><li><button class="wl" data-act="prev" data-v="Discount policy"><b>Discount policy</b></button><small>What reps can discount on their own.</small></li><li><button class="wl" data-act="prev" data-v="Quarter-end close"><b>Quarter-end close</b></button><small>The rules for the last 3 business days of a quarter.</small></li></ul>';
 h+='<div class="sugg">'+['Who approves a 30% discount?','Why do approvals expire after 14 days?','What happens at quarter end?','Do flat renewals need approval?'].filter(function(x){return x!==S.q}).map(function(x){return '<button class="press" data-act="sug" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div></div>';
 return h;
}

/* ---------- popovers ---------- */
var PREV={'Maria Okafor':['Person','Owns the approval process, lead routing, and forecasting, in RevOps.'],'CPQ quote sync':['Integration','Sends approved discounts from Salesforce to quotes. Failing for multi-currency deals since Oct 29. 2 statements, 1 being checked.'],'Discount policy':['Page','What reps can discount on their own, and what needs approval. 3 statements, all verified.'],'Quarter-end close':['Page','The rules for the last 3 business days of a quarter, including the Slack approvals.'],'Deal Desk':['Page','The team that runs approvals and contract exceptions. Led by Priya Shah since Oct 12.'],'Renewals':['Page','How renewals are priced and approved.'],'Case escalation':['Page','When support cases go to engineering. Includes the unwritten data-loss rule.']};
function openRef(n){
 var r=n==14?{k:'talk',src:'Maria Okafor, on the Talk tab',d:'Just now',q:'Yes, on purpose since 2023. Flat renewals don’t change revenue risk.',u:'A process owner answered Asoka’s question. The article was rewritten and cited this answer.',v:null}:REFS[n];
 var ver=!!r.v,chk=r.check;
 var chain='<div class="chain" aria-label="How Asoka learned this"><span class="y">Observed</span><i>›</i><span class="y">Reflected</span><i>›</i><span class="y">Written</span><i>›</i><span class="'+(ver?'y':'n')+'">'+(ver?'Verified':'Not verified yet')+'</span></div>';
 $('pop').innerHTML='<div class="pc"><div class="pk">Source '+n+': '+KIND[r.k]+', '+esc(r.src)+', '+esc(r.d)+(chk?'. <span style="color:var(--warn)">'+esc(chk)+'</span>':'')+'</div><div class="pq">“'+esc(r.q)+'”</div><div class="pu">'+esc(r.u)+'</div>'+chain+(ver?'<div style="font-size:13px;color:var(--ok);font-weight:600;margin-bottom:8px">✓ Verified by '+esc(r.v)+'</div>':'')+'<button class="wl" data-act="tohist">See it in Changes</button><button class="px press" data-act="unpop" aria-label="Close">×</button></div>';
 $('pop').classList.add('on');$('scrim').classList.add('on');
}
function openPrev(name){var p=PREV[name]||['Article',name+'.'];$('pop').innerHTML='<div class="pc"><div class="pk">'+p[0]+'</div><div class="pq" style="font-weight:500">'+esc(name)+'</div><div class="pu">'+esc(p[1])+'</div><div style="font-size:13px;color:var(--ink2)">Prototype: only Opportunity approvals has a full page.</div><button class="px press" data-act="unpop" aria-label="Close">×</button></div>';$('pop').classList.add('on');$('scrim').classList.add('on')}
function closePop(){$('pop').classList.remove('on');$('scrim').classList.remove('on')}

/* ---------- the learning moment ---------- */
function learn(){
 if(S.learned)return;S.talkTyping=true;if(S.view==='page'&&S.tab==='talk')render();
 setTimeout(function(){S.talkTyping=false;S.learned=true;S.justLearned=true;S.asks=Math.max(0,S.asks-1);S.edits++;
  if(S.view==='page'){render();toast('Maria answered. Asoka updated the page.')}
  setTimeout(function(){S.justLearned=false},3200);
 },RM?300:1800);
}

/* ---------- render ---------- */
function render(){
 var m=$('main');setTimeout(renderDock,0);
 m.innerHTML=S.view==='home'?homeHtml():S.view==='ask'?askHtml():pageHtml();
 if(S.view==='page'&&S.tab==='read'){rpApply();bindToc()}
 try{var h=S.view==='home'?'home':S.view==='ask'?'ask':'approvals'+(S.tab!=='read'?'-'+S.tab:'');if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h)}catch(e){}
}
var io=null;
function bindToc(){
 if(io)io.disconnect();if(!('IntersectionObserver' in window))return;
 io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){S.toc=e.target.id.slice(2);document.querySelectorAll('.toc button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.toc)})}})},{rootMargin:'-80px 0px -70% 0px'});
 document.querySelectorAll('.art-body section').forEach(function(s){io.observe(s)});
}
function go(v,o){
 o=o||{};S.view=v;if(o.tab)S.tab=o.tab;else if(v==='page'&&!o.keepTab)S.tab='read';closePop();
 if(RP.t){clearInterval(RP.t);RP.t=null}
 render();
 if(o.sec){setTimeout(function(){var e=$('s-'+o.sec)||$(o.sec);if(e)e.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})},60)}else window.scrollTo(0,0);
 clearTimeout(S.learnT);if(v==='page'&&!S.learned)S.learnT=setTimeout(learn,20000);
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,v=b.dataset.v;
 if(a==='home')go('home');
 else if(a==='open')go('page',{sec:v||null});
 else if(a==='talk')go('page',{tab:'talk'});
 else if(a==='tab'){S.tab=v;render();window.scrollTo(0,0)}
 else if(a==='toc'){var el=$('s-'+v);if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}
 else if(a==='ref')openRef(+b.dataset.n);
 else if(a==='prev')openPrev(v);
 else if(a==='unpop')closePop();
 else if(a==='tohist'){closePop();S.tab='history';S.openRev=S.learned?'r6':'r5';S.hlRev=S.openRev;render();window.scrollTo(0,0);setTimeout(function(){S.hlRev=null},2500)}
 else if(a==='rev'){S.openRev=S.openRev===v?null:v;render()}
 else if(a==='learn')learn();
 else if(a==='goRenewal'){S.tab='read';render();setTimeout(function(){var el=$('renewal');if(el){el.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});el.classList.remove('upd');void el.offsetWidth;el.classList.add('upd')}},60)}
 else if(a==='rpplay')rpPlay();
 else if(a==='focusq'){$('cin').focus()}
 else if(a==='sug')chatAsk(v,[]);
 else if(a==='send')sendFromDock();
 else if(a==='mic')toggleMic();
 else if(a==='attach')$('file').click();
 else if(a==='unattach'){var f=CH.files.splice(+b.dataset.i,1)[0];renderDock()}
 else if(a==='showchat'){CH.open=true;renderChat()}
 else if(a==='hidechat'){CH.open=false;renderChat()}
 else if(a==='newchat'){CH.msgs=[];CH.open=false;askSeq++;renderChat()}
 else if(a==='scope'){CH.scope=CH.scope==='page'?'all':'page';renderDock()}
 else if(a==='area'){toast(v==='Sales Cloud'?'Opening the featured Sales Cloud article.':'Prototype: only Opportunity approvals has a full page.');if(v==='Sales Cloud')go('page')}
 else if(a==='loopstep'){var li=document.querySelectorAll('#lsteps li');li.forEach(function(x,i){x.classList.toggle('on',i==b.dataset.i)})}
});
$('file').addEventListener('change',function(e){Array.prototype.forEach.call(e.target.files,function(f){if(CH.files.length<4)CH.files.push({name:f.name,size:f.size,type:f.type,kind:fileKind(f),url:/^image\//.test(f.type)?URL.createObjectURL(f):''})});e.target.value='';renderDock();$('cin').focus()});
$('cin').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendFromDock()}});
var lastY=0;
function setLean(on){var d=$('dock');if(!d||d.classList.contains('lean')===on)return;d.classList.toggle('lean',on);setTimeout(function(){document.documentElement.style.setProperty('--dockh',d.offsetHeight+'px')},300)}
window.addEventListener('scroll',function(){var y=window.scrollY,hd=document.querySelector('header');if(hd)hd.classList.toggle('sc',y>4);
 if(CH.open||document.activeElement===$('cin'))setLean(false);else if(y>160&&y>lastY+6)setLean(true);else if(y<lastY-6||y<=160)setLean(false);
 if(Math.abs(y-lastY)>6)lastY=y},{passive:true});
$('cin').addEventListener('focus',function(){setLean(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePop();if((e.key==='Enter'||e.key===' ')&&e.target.tagName==='g'){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
var h0=location.hash.slice(1),m0=h0.match(/^approvals(?:-(talk|history))?$/);
if(m0){S.view='page';S.tab=m0[1]||'read';render();S.learnT=setTimeout(learn,20000)}else render();
if(S.view==='page'&&S.tab==='read'&&!RM)setTimeout(function(){if(!RP.t&&$('rp'))rpPlay()},1200);
renderDock();window.addEventListener('resize',renderDock);
})();
</script>
