<style>
:root{
 --bg:#F7F8F6;--panel:#FFFFFF;--panel2:#F0F2EF;--ink:#17201C;--ink2:#5B6661;--line:#E2E6E1;--accent:#4B45D6;--accb:#ECEBFC;
 --ok:#1E8467;--okb:#E1F3EC;--warn:#B06E12;--warnb:#FCF0DA;
 --sh:0 1px 2px rgba(20,30,25,.05),0 8px 24px rgba(20,30,25,.06);
 --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --serif:"Geist Serif",Georgia,"Times New Roman",serif;
 --eo:cubic-bezier(.23,1,.32,1);--eio:cubic-bezier(.77,0,.175,1);
 color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--bg:#111513;--panel:#191E1C;--panel2:#212825;--ink:#ECEFEC;--ink2:#A2ADA8;--line:#2B3330;--accent:#A9A5FF;--accb:#26244A;--ok:#6FD3B4;--okb:#16362D;--warn:#F0C36B;--warnb:#3D3016;--sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111513;--panel:#191E1C;--panel2:#212825;--ink:#ECEFEC;--ink2:#A2ADA8;--line:#2B3330;--accent:#A9A5FF;--accb:#26244A;--ok:#6FD3B4;--okb:#16362D;--warn:#F0C36B;--warnb:#3D3016;--sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.press{transition:transform .16s var(--eo),background-color .2s var(--eo),box-shadow .2s var(--eo)}
.press:active{transform:scale(.97)}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s var(--eo)}
header.sc{border-bottom-color:var(--line)}
.hrow{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.logo b{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:-.01em}
.logo span{font-size:13px;color:var(--ink2);font-weight:500}
.sp{flex:1}
.mm{width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.crumbs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px;font-size:13.5px;white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:8px;color:var(--ink2);font-weight:600;cursor:pointer}
.crumbs button.cur{color:var(--ink)}
.crumbs i{font-style:normal;color:var(--ink2);opacity:.6}
main{padding:10px 0 170px}
.enter>*{animation:rise .42s var(--eo) both}
.enter>*:nth-child(2){animation-delay:40ms}.enter>*:nth-child(3){animation-delay:80ms}.enter>*:nth-child(4){animation-delay:120ms}.enter>*:nth-child(5){animation-delay:160ms}.enter>*:nth-child(6){animation-delay:200ms}
/* ask front door */
.door h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,6vw,46px);line-height:1.08;letter-spacing:-.02em;margin:18px 0 18px}
.qbox{display:flex;gap:8px;background:var(--panel);box-shadow:var(--sh);border-radius:22px;padding:8px 8px 8px 18px;align-items:center}
.qbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);height:44px;outline:none}
.qgo{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.sug{border:0;background:var(--panel2);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:500;cursor:pointer;text-align:left}
.sec-h{font-size:13.5px;font-weight:700;color:var(--ink2);margin:30px 0 10px}
.card{background:var(--panel);border-radius:20px;box-shadow:var(--sh);padding:18px}
.mapcard{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer}
.mapcard svg{flex:none}
.mapcard b{display:block;font-size:17px;font-weight:600}
.mapcard span{color:var(--ink2);font-size:14.5px}
.mapcard b{color:var(--ink)}
.own{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:var(--panel);box-shadow:var(--sh);border-radius:16px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.own .x1{flex:1}
.own b{display:block;font-weight:600;font-size:15.5px}
.own small{color:var(--ink2);font-size:13.5px}
.tag{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;flex:none}
.tag.chg{background:var(--accb);color:var(--accent)}
.tag.chk{background:var(--warnb);color:var(--warn)}
/* answer */
.ans{margin-top:22px}
.ans .lead{font-family:var(--serif);font-size:22px;line-height:1.4;margin:0 0 6px}
.ans .note{font-size:14.5px;color:var(--ink2);margin:0 0 12px}
.crow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:var(--panel);box-shadow:var(--sh);border-radius:16px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.crow .x1{flex:1;min-width:0}
.crow p{font-family:var(--serif);font-size:18px;line-height:1.45;margin:0}
.crow .st{display:block;font-size:13.5px;font-weight:600;margin-top:4px}
.st.chk{color:var(--warn)}.st.chg{color:var(--accent)}
.chev{flex:none;color:var(--ink2);margin-top:4px;transition:transform .2s var(--eo)}
@media (hover:hover) and (pointer:fine){.crow:hover .chev,.own:hover .chev{transform:translateX(3px)}.crow:hover,.own:hover{box-shadow:0 1px 2px rgba(20,30,25,.06),0 12px 30px rgba(20,30,25,.1)}}
.openb{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:var(--ink);color:var(--panel);border-radius:16px;padding:14px 18px;font-weight:600;font-size:16px;cursor:pointer;margin-top:6px}
/* map */
.mapv{margin:0 -18px}
.mapbox{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1/1;touch-action:manipulation}
.mapbox>svg{width:100%;height:100%;display:block;overflow:hidden}
.zb svg{display:inline-block}
.cam{transform-box:view-box;transform-origin:0 0;transition:transform .7s var(--eio)}
.dm,.pr{transition:opacity .45s var(--eo)}
.lab{transition:opacity .35s var(--eo);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round}
svg[data-lvl="0"] .l1,svg[data-lvl="0"] .l2{opacity:0}
svg[data-lvl="1"] .l0,svg[data-lvl="1"] .l2{opacity:0}
svg[data-lvl="1"] .dm:not(.on) .l1{opacity:0}
svg[data-lvl="2"] .l0,svg[data-lvl="2"] .l1{opacity:0}
svg[data-lvl="1"] .dm:not(.on),svg[data-lvl="2"] .dm:not(.on){opacity:.18}
svg[data-lvl="2"] .pr:not(.on){opacity:.2}
svg[data-lvl="0"] .pc,svg[data-lvl="0"] .cc,svg[data-lvl="1"] .cc{pointer-events:none}
svg[data-lvl="2"] .dc{pointer-events:none}
.dc,.pc,.cc{cursor:pointer}
.mcap{max-width:560px;margin:4px auto 0;padding:0 18px}
.mcap .card{animation:rise .3s var(--eo) both}
.mcap h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.mcap p{margin:0;color:var(--ink2);font-size:15px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.zbtns{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.zb{border:0;background:var(--panel);box-shadow:var(--sh);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.dark{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:14.5px}
.dark .x1{flex:1}
.mini{border:0;background:var(--ink);color:var(--panel);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.mini.ok{background:var(--okb);color:var(--ok);cursor:default}
/* process page */
.ptitle{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5.5vw,44px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 8px}
.what{font-family:var(--serif);font-size:19px;color:var(--ink2);margin:0 0 14px}
.foryou{background:var(--accb);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.foryou b{color:var(--accent)}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pact{border:0;background:var(--panel);box-shadow:var(--sh);border-radius:999px;padding:9px 15px;font-size:14.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pact.on{background:var(--ink);color:var(--panel)}
.sh2{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.01em;margin:32px 0 4px}
.shs{color:var(--ink2);font-size:14.5px;margin:0 0 12px}

var STOP='a an the is are do does did i we my our to of for in on at it be by and or what who why how when where which can should would could if this that with about me you there any get'.split(' ');
function toks(s){return s.toLowerCase().replace(/[’']/g,'').split(/[^a-z0-9$%]+/).filter(function(w){return w&&STOP.indexOf(w)<0}).map(function(w){return w.replace(/(ing|ed|es|s)$/,'')})}
function retrieve(q,n){
 var qt=toks(q);if(!qt.length)return [];
 var SYN={valid:'expire',last:'expire',long:'expire',lifetime:'expire',boss:'approv',owner:'own',owns:'own',fast:'within',quick:'within',respond:'response',reply:'response',price:'discount',deal:'deal',renew:'renewal',lead:'lead'};qt=qt.map(function(w){return SYN[w]||w});
 return C.map(function(c){var p=proc(c.p),main=toks(c.t+' '+c.s+' '+p.n),side=toks(p.w+' '+(c.why.map(function(w){return w.t}).join(' '))+' '+(c.drift?c.drift.practice:'')),sc=0;qt.forEach(function(w){var pre=function(arr){return arr.some(function(h){return h.length>3&&w.length>3&&(h.indexOf(w)===0||w.indexOf(h)===0)})};if(main.indexOf(w)>=0)sc+=2;else if(pre(main))sc+=1.2;else if(side.indexOf(w)>=0)sc+=.6;else if(pre(side))sc+=.3});return {c:c,sc:sc}})
  .filter(function(x){return x.sc>0}).sort(function(a,b){return b.sc-a.sc}).slice(0,n||3).map(function(x){return x.c});
}

function localAnswer(q){
 var l=q.toLowerCase();
 for(var i=0;i<CUR.length;i++){if(CUR[i][0].test(l)){var a=JSON.parse(JSON.stringify(CUR[i][1]));a.open=cl(a.ids[0]).p;return a}}
 var hits=retrieve(q,3);
 if(!hits.length)return {unknown:true,ids:[]};
 var chk=hits.filter(function(c){return c.st==='chk'})[0];
 return {local:true,lead:hits[0].t,note:chk?'One related item needs attention: '+chk.reason.toLowerCase()+'.':'',ids:hits.map(function(c){return c.id}),open:hits[0].p};
}
var CLAUDE=(function(){try{if(window.claude&&window.claude.use)return window.claude}catch(e){}try{if(window.parent&&window.parent!==window&&window.parent.claude&&window.parent.claude.use)return window.parent.claude}catch(e){}return null})();
var sampleP=CLAUDE?CLAUDE.use('sample').catch(function(){return null}):Promise.resolve(null);
var askCtl=null,askSeq=0;
function corpus(){return C.map(function(c){var p=proc(c.p);return c.id+' | '+p.n+' | '+(c.st==='chk'?'CHECK ('+c.reason+')':c.st==='chg'?'SOLID, '+c.reason:'SOLID')+' | '+c.t+(c.why.length?' Why: '+c.why.map(function(w){return w.t}).join(' '):'')+(c.drift?' In practice: '+c.drift.practice:'')}).join('\n')}
function askClaude(q,seq){
 sampleP.then(function(sample){
  if(!sample||seq!==askSeq){if(seq===askSeq&&S.ans){S.ans.pending=false;if(S.view==='ask')render(false)}return}
  askCtl=new AbortController();
  var prompt='You are Asoka, a digital coworker that knows how a company named Northwind works. Answer ONLY from the knowledge below. Each line is: id | process | trust | claim.\n\nRules:\n- Answer in at most 2 short, plain sentences. No jargon, no hedging words like "typically".\n- Cite the ids you used (1 to 4).\n- If you rely on a line marked CHECK, add a one-sentence note saying what to double-check, in plain words.\n- If the knowledge does not answer the question, set unknown to true and leave lead empty. Never guess.\n\nReturn JSON only: {"lead": string, "note": string, "ids": string[], "unknown": boolean}\n\nKnowledge:\n'+corpus()+'\n\nQuestion: '+q;
  sample.json(prompt,{modelTier:'quick',signal:askCtl.signal}).then(function(r){
   if(seq!==askSeq)return;
   var ids=(r&&Array.isArray(r.ids)?r.ids:[]).filter(function(id){return cl(id)}).slice(0,4);
   if(r&&r.unknown||!ids.length||!r.lead){S.ans={unknown:true,ids:[],src:'asoka'};if(S.asked.indexOf(q)<0)S.asked.push(q)}
   else S.ans={lead:String(r.lead),note:r.note?String(r.note):'',ids:ids,open:cl(ids[0]).p,src:'asoka',blast:/break|depend|impact/.test(q.toLowerCase())};
   S.ans.up=true;if(S.view==='ask')render(false);
  }).catch(function(){if(seq!==askSeq||!S.ans)return;S.ans.pending=false;if(S.view==='ask')render(false)});
 });
}
function doAsk(q){
 q=(q||'').trim();if(!q)return;S.q=q;askSeq++;if(askCtl){try{askCtl.abort()}catch(e){}}
 var a=localAnswer(q);a.src='local';a.pending=!!CLAUDE;
 if(a.unknown&&!CLAUDE&&S.asked.indexOf(q)<0)S.asked.push(q);
 S.ans=a;
 if(S.view!=='ask')go('ask');else{render(false);setTimeout(function(){var e=document.querySelector('.ans');if(e)e.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})},40)}
 if(CLAUDE)askClaude(q,askSeq);
}

function mapSvg(){
 var s='<g class="cam" id="cam">',L=links();
 Object.keys(L).forEach(function(k){var ab=k.split('|'),a=dom(ab[0]),b=dom(ab[1]),dx=b.x-a.x,dy=b.y-a.y,dl=Math.hypot(dx,dy),ux=dx/dl,uy=dy/dl,ax=a.x+ux*(a.r+3),ay=a.y+uy*(a.r+3),bx=b.x-ux*(b.r+3),by=b.y-uy*(b.r+3),mx=(ax+bx)/2-uy*14,my=(ay+by)/2+ux*14;s+='<path class="lk" d="M'+ax.toFixed(1)+' '+ay.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+bx.toFixed(1)+' '+by.toFixed(1)+'" fill="none" stroke="var(--accent)" stroke-opacity=".35" stroke-width="'+(1.2+L[k]*.8).toFixed(1)+'" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'});
 DOM.forEach(function(d){

  var fs=12*d.r/150;
  PROC.filter(function(p){return p.d===d.id}).forEach(function(p){
   var px=d.x+p.dx,py=d.y+p.dy,pd=p.cov<.55,cs=claimsOf(p.id);

   s+='<text class="lab l1" x="'+px+'" y="'+(py+p.r+fs*1.25).toFixed(2)+'" text-anchor="middle" font-size="'+fs.toFixed(2)+'" font-weight="600" fill="var(--ink)" stroke-width="'+(fs*.25).toFixed(2)+'">'+p.n+'</text>';
   var R=p.r*(cs.length>3?.6:.5),cf=11.5*p.r/120;
   cs.forEach(function(c,i){
    var an=-Math.PI/2+i*2*Math.PI/cs.length,cx=px+R*Math.cos(an),cy=py+R*Math.sin(an),co=Math.cos(an),si=Math.sin(an),col=c.st==='chk'?'var(--warn)':c.st==='chg'?'var(--accent)':'var(--ink)';

function setLvl(lvl,d,p){S.mlvl=lvl;if(d!==undefined)S.mdom=d;if(p!==undefined)S.mproc=p;S.mclaim=null;applyCam()}
/* gestures */
var snapT=null;function snapSoon(){clearTimeout(snapT);snapT=setTimeout(function(){if(S.view==='map'&&S.mlvl===2&&!S.gesturing){var t=camFor();if(Math.abs(t.s-S.cam.s)/t.s>.08||Math.hypot(t.x-S.cam.x,t.y-S.cam.y)>proc(S.mproc).r*.3){S.cam=t;setCamStyle(true)}}},420)}
function levelFromCam(){
 var c=S.cam,old=S.mlvl+'|'+S.mdom+'|'+S.mproc,lvl=0,dd=null,pp=null;
 if(c.s>=1.8){
  var best=null,bd=1e9;DOM.forEach(function(d){var dist=Math.hypot(c.x-d.x,c.y-d.y)/d.r;if(dist<bd){bd=dist;best=d}});
  if(best&&bd<1.6){lvl=1;dd=best.id;
   if(c.s>=150/best.r*1.9){var bp=null,bpd=1e9;PROC.filter(function(p){return p.d===best.id}).forEach(function(p){var dist=Math.hypot(c.x-(best.x+p.dx),c.y-(best.y+p.dy))/p.r;if(dist<bpd){bpd=dist;bp=p}});if(bp&&bpd<2.2){lvl=2;pp=bp.id}}
  }
 }
 if(old!==lvl+'|'+dd+'|'+pp){S.mlvl=lvl;S.mdom=dd;S.mproc=pp;S.mclaim=null;syncLevelUI()}
}
var dragged=0;
function bindGestures(){
 var sv=$('msvg');if(!sv)return;var pts={},start=null,moved=false,lastTap=0;
 function vb(e){var r=sv.getBoundingClientRect();return {x:(e.clientX-r.left)*400/r.width,y:(e.clientY-r.top)*400/r.height}}
 function world(p){return {x:(p.x-200)/S.cam.s+S.cam.x,y:(p.y-200)/S.cam.s+S.cam.y}}
 function zoomAt(p,f){var w=world(p),ns=Math.max(.8,Math.min(34,S.cam.s*f));S.cam={s:ns,x:w.x-(p.x-200)/ns,y:w.y-(p.y-200)/ns};setCamStyle(false);levelFromCam();snapSoon()}
 function hideHint(){if(S.hint){S.hint=false;var h=$('mhint');if(h)h.style.opacity=0}}
 sv.addEventListener('pointerdown',function(e){pts[e.pointerId]=vb(e);moved=false;start={cam:{x:S.cam.x,y:S.cam.y,s:S.cam.s},p:vb(e),t:Date.now()};if(Object.keys(pts).length===2){var k=Object.keys(pts);start.dist=Math.hypot(pts[k[0]].x-pts[k[1]].x,pts[k[0]].y-pts[k[1]].y)}});
 sv.addEventListener('pointermove',function(e){
  if(!pts[e.pointerId])return;var p=vb(e),prev=pts[e.pointerId];pts[e.pointerId]=p;var k=Object.keys(pts);
  if(k.length===2&&start.dist){var a=pts[k[0]],b=pts[k[1]],dist=Math.hypot(a.x-b.x,a.y-b.y);zoomAt({x:(a.x+b.x)/2,y:(a.y+b.y)/2},dist/start.dist);start.dist=dist;moved=true;hideHint();return}
  if(k.length===1){var dx=p.x-prev.x,dy=p.y-prev.y;if(!moved&&Math.hypot(p.x-start.p.x,p.y-start.p.y)<6)return;
   if(!moved){try{sv.setPointerCapture(e.pointerId)}catch(err){}}
   moved=true;sv.classList.add('drag');hideHint();S.cam.x-=dx/S.cam.s;S.cam.y-=dy/S.cam.s;setCamStyle(false);levelFromCam()}
 });
 function up(e){var wasMove=moved;if(wasMove)snapSoon();delete pts[e.pointerId];sv.classList.remove('drag');if(wasMove){dragged=Date.now()}
  if(!wasMove&&e.type==='pointerup'){var now=Date.now();if(now-lastTap<300){zoomAt(vb(e),2);dragged=Date.now();lastTap=0}else lastTap=now}
  if(!Object.keys(pts).length)moved=false}
 sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);sv.addEventListener('pointerleave',function(e){if(pts[e.pointerId]&&e.pointerType==='mouse')up(e)});
 sv.addEventListener('wheel',function(e){e.preventDefault();hideHint();zoomAt(vb(e),Math.exp(-e.deltaY*.0022))},{passive:false});
}

/* ================= process view ================= */
function driftHtml(c,asBtn){
 var d=c.drift,dots='';for(var i=0;i<d.y;i++)dots+='<i class="y"></i>';for(i=0;i<d.n;i++)dots+='<i class="n"></i>';
 var inner='<span class="dt"><span>'+esc(c.s)+'</span>'+(asBtn?CHEV:'')+'</span><span class="dgrid"><span class="dl">Policy says</span><span>'+esc(d.policy)+'</span><span class="dl">In practice</span><span class="pr2">'+esc(d.practice)+'</span></span><span class="dots" aria-hidden="true">'+dots+'</span><span class="dleg" style="display:block">'+(d.n?'Filled: '+esc(d.yl.toLowerCase())+'. Outlined: '+esc(d.nl.toLowerCase())+'.':'Every one: '+esc(d.yl.toLowerCase())+'.')+'</span>';
 return asBtn?'<button class="drift press" data-act="claim" data-id="'+c.id+'">'+inner+'</button>':'<div class="drift">'+inner+'</div>';
}
function dependents(pid){return PROC.filter(function(q){return q.deps.indexOf(pid)>=0})}
function blastHtml(p){
 var cx=210,cy=110,s='',r1,r2,list;
 if(p.id==='approvals'){r1=[['Lock handler',0],['Amount lock rule',0],['CPQ quote sync',1],['Deal Desk SLA dashboard',0]];r2=[['38 reps',0],['Pipeline report',0],['Quote PDFs',1]];list=[['Lock handler','Locks and unlocks records',0],['Amount lock rule','Stops edits after approval',0],['CPQ quote sync','Already failing for multi-currency',1],['Deal Desk SLA dashboard','Measures approval time',0],['Pipeline report','Groups deals by approval stage',0],['Quote PDFs','Show approved discounts. Fed by CPQ sync',1],['38 reps','Submit approvals every week',0]]}
 else{var dps=dependents(p.id);r1=dps.map(function(q){return [q.n,claimsOf(q.id).some(function(c){return c.reason==='Failing now'})?1:0]});var r2s={};dps.forEach(function(q){dependents(q.id).forEach(function(z){if(z.id!==p.id&&dps.indexOf(z)<0)r2s[z.n]=1})});r2=Object.keys(r2s).slice(0,4).map(function(n){return [n,0]});list=r1.map(function(x){return [x[0],'Depends on it directly',x[1]]}).concat(r2.map(function(x){return [x[0],'Depends on it indirectly',0]}))}
 if(!r1.length)return '<div class="unk"><span class="x1">Nothing Asoka knows depends on this directly.<small>Changes here are low risk.</small></span></div>';
 [44,88].forEach(function(r){s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>'});
 function ring(arr,R,off){arr.forEach(function(n,i){var an=off+i*2*Math.PI/arr.length,x=cx+R*Math.cos(an),y=cy+R*.82*Math.sin(an),co=Math.cos(an);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="6" fill="'+(n[1]?'var(--warn)':'var(--ink)')+'"/><text x="'+(x+(co>.2?10:co<-.2?-10:0)).toFixed(1)+'" y="'+(y+(Math.abs(co)<=.2?(Math.sin(an)>0?18:-10):4)).toFixed(1)+'" text-anchor="'+(co>.2?'start':co<-.2?'end':'middle')+'" font-size="12" font-weight="500" fill="var(--ink)" paint-order="stroke" stroke="var(--panel)" stroke-width="4">'+esc(n[0])+'</text>'})}
 ring(r1,44,-Math.PI/2);ring(r2,88,-Math.PI/2+.5);
 s+='<rect x="'+(cx-46)+'" y="'+(cy-14)+'" width="92" height="28" rx="14" fill="var(--accent)"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--panel)">This process</text>';
 var bad=list.filter(function(x){return x[2]}).length;
 return '<div class="blast"><svg viewBox="0 0 420 220" role="img" aria-label="What depends on '+esc(p.n)+'">'+s+'</svg><ul class="blist">'+list.map(function(r){return '<li class="'+(r[2]?'w':'')+'"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></li>'}).join('')+'</ul>'+(p.id==='approvals'?'<p class="shs" style="margin:10px 4px 0">Talk to Maria Okafor in RevOps before changing it. She owns the process.</p>':'')+'</div>';
}
function procHtml(p){
 var cs=claimsOf(p.id),flat=cs.filter(function(c){return !c.drift}),dr=cs.filter(function(c){return c.drift}),chg=cs.filter(function(c){return c.st==='chg'});
 var h='<div class="ptitle">'+esc(p.n)+'</div><p class="what">'+esc(p.w)+'</p>';
 if(p.own)h+='<div class="foryou"><b>For you:</b> one rule changed since your last visit. Discounts over 35% now go to the CRO.</div>';
 else if(chg.length)h+='<div class="foryou"><b>Recently changed:</b> '+esc(chg[0].t)+'</div>';
 if(p.cov<.55)h+='<div class="foryou" style="background:var(--warnb)"><b style="color:var(--warn)">Asoka knows little here.</b> Only '+cs.length+' thing'+(cs.length===1?'':'s')+' observed so far. Treat this page as a starting point.</div>';
 var nDep=p.id==='approvals'?7:dependents(p.id).length;
 h+='<div class="pacts"><button class="pact press'+(S.blast?' on':'')+'" data-act="blast">What breaks if it changes</button><button class="pact press" data-act="watch" data-id="'+p.id+'">'+(S.watch[p.id]?'Watching':'Watch for changes')+'</button><button class="pact press" data-act="mapHere">Show on map</button></div>';
 h+='<div class="sh2">What’s true</div><p class="shs">'+flat.length+' thing'+(flat.length===1?'':'s')+'. Colored lines are worth a second look.</p>'+flat.map(crow).join('');
 if(dr.length)h+='<div class="sh2">Policy vs. practice</div><p class="shs">Where what people do differs from what’s written down. Only visible because Asoka watches the work happen.</p>'+dr.map(function(c){return driftHtml(c,true)}).join('');
 h+='<div class="sh2" id="blastsec">What breaks if it changes</div><p class="shs">'+(nDep?nDep+' thing'+(nDep===1?' depends':'s depend')+' on this.':'Nothing Asoka knows depends on this.')+'</p>'+(S.blast?blastHtml(p):(nDep?'<button class="pact press" data-act="blast">Show the ripple</button>':''));
 var dp=p.deps.map(proc).filter(Boolean);
 if(dp.length)h+='<div class="sh2">Connected to</div><p class="shs">What this process relies on or works with.</p><div class="chips2">'+dp.map(function(q){return '<button class="chip2 press" data-act="openp" data-v="'+q.id+'">'+esc(q.n)+(q.d!==p.d?' · '+esc(dom(q.d).n):'')+'</button>'}).join('')+'</div>';
 h+='<div class="sh2">What Asoka doesn’t know yet</div><p class="shs">Gaps are shown, not hidden.</p>';
 var unk=p.unk.slice();if(!unk.length)h+='<p class="shs">No open questions right now.</p>';
 unk.forEach(function(u,i){var key=p.id+'-'+i;h+='<div class="unk"><span class="x1">'+esc(u[0])+'<small>'+esc(u[1])+'</small></span>'+(u[2]?'<span class="tag chk">Asking</span>':S.unk[key]?'<span class="mini ok">Asking now</span>':'<button class="mini press" data-act="findout" data-id="'+key+'">Find out</button>')+'</div>'});
 h+='<p class="gen">Generated by Asoka from '+(cs.length*3+2)+' observations. Every line links to why it’s true.</p>';
 return h;
}

/* ================= claim view ================= */
function claimHtml(c){
 var p=proc(c.p);
 var h='<div class="cstate'+(c.st==='chk'?' chk':c.st==='chg'?' chg':'')+'">'+(c.st==='solid'?'✓ Solid. Several sources agree.':c.st==='chg'?esc(c.reason)+'. Solid.':'Check this: '+esc(c.reason.toLowerCase()))+'</div><div class="ctext">'+esc(c.t)+'</div>'+(c.note?'<p class="what" style="font-size:17px">'+esc(c.note)+'</p>':'');
 if(c.drift)h+='<div class="sh2">Policy vs. practice</div>'+driftHtml(c,false);
 h+='<div class="sh2">Why it’s like this</div>';
 h+=c.why.length?'<ol class="chain">'+c.why.map(function(w){return '<li><div class="cd">'+esc(w.d)+'</div><div class="ct">'+esc(w.t)+'</div><div class="cs">'+esc(w.s)+'</div></li>'}).join('')+'</ol>':'<div class="unk"><span class="x1">Asoka doesn’t know why yet<small>'+(c.id==='c7'?'It asked Maria Okafor, who owns the process.':'It will ask the owner of '+esc(p.n.toLowerCase())+'.')+'</small></span>'+(c.id==='c7'||S.unk['why-'+c.id]?'<span class="tag chk">Asking</span>':'<button class="mini press" data-act="findout" data-id="why-'+c.id+'">Find out</button>')+'</div>';
 h+='<div class="sh2">How it changed</div>';
 if(c.hist.length>1){var i=S.tt[c.id]!=null?S.tt[c.id]:c.hist.length-1,v=c.hist[i];
  h+='<div class="tt"><div class="tthead"><span style="font-size:13.5px;font-weight:700;color:var(--ink2)" id="ttd">'+esc(v.d)+'</span><span class="ttbadge'+(i<c.hist.length-1?' then':'')+'" id="ttb">'+(i<c.hist.length-1?'What we believed then':'Now')+'</span></div><p class="ttv" id="ttv">'+esc(v.t)+'</p><p class="ttw" id="ttw">What changed it: '+esc(v.w)+'</p><input type="range" min="0" max="'+(c.hist.length-1)+'" step="1" value="'+i+'" data-inp="tt" data-id="'+c.id+'" aria-label="Move through time"><div class="ttl">'+c.hist.map(function(x){return '<span>'+esc(x.d)+'</span>'}).join('')+'</div></div>';
 }else h+='<p class="ttone">Unchanged since '+esc(c.hist[0].d)+'. '+esc(c.hist[0].w)+'</p>';
 h+='<details class="ev"><summary>Based on '+c.src.length+' source'+(c.src.length===1?'':'s')+' ›</summary><ul>'+c.src.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul></details>';
 var rel=c.rel.slice();if(rel.indexOf(p.n)<0)rel.unshift(p.n);
 h+='<div class="sh2" style="margin-top:18px">Connected to</div><div class="chips2">'+rel.map(function(r){return '<button class="chip2 press" data-act="peek" data-v="'+esc(r)+'">'+esc(r)+'</button>'}).join('')+'</div>';
 return h;
}

/* ================= chrome ================= */
function curProc(){return S.view==='proc'?proc(S.pid):S.view==='claim'?proc(cl(S.cid).p):null}
function crumbList(){
 var L=[{l:'Northwind',a:'cr0'}];
 if(S.view==='map'){if(S.mlvl>=1)L.push({l:dom(S.mdom).n,a:'cr1',v:S.mdom});if(S.mlvl===2)L.push({l:proc(S.mproc).n,a:'cr2',v:S.mproc});if(S.mclaim)L.push({l:cl(S.mclaim).s,a:'claim',v:S.mclaim})}
 else{var p=curProc();if(p){L.push({l:dom(p.d).n,a:'cr1',v:p.d});L.push({l:p.n,a:S.view==='claim'?'openp':'cr2',v:p.id});if(S.view==='claim')L.push({l:cl(S.cid).s,a:'claim',v:S.cid})}}
 return L;
}
function renderCrumbs(){var el=$('crumbs');if(S.view==='ask'){el.innerHTML='';el.style.display='none';return}el.style.display='';var L=crumbList();el.innerHTML=L.map(function(c,i){return (i?'<i>›</i>':'')+'<button class="'+(i===L.length-1?'cur':'')+'" data-act="'+c.a+'"'+(c.v?' data-v="'+c.v+'" data-id="'+c.v+'"':'')+'>'+esc(c.l)+'</button>'}).join('');setTimeout(function(){el.scrollLeft=el.scrollWidth},0)}
function renderTop(){var cp=curProc(),here=S.view==='map'?S.mdom:cp?cp.d:null;$('hrow').innerHTML='<button class="logo" data-act="home"><b>Wikimind</b><span>Northwind</span></button><span class="sp"></span>'+(S.view==='map'?'':'<button class="mm press" data-act="mapHere" aria-label="Show where you are on the map">'+miniSvg(26,here)+'</button>');renderCrumbs();$('ft').style.display=S.view==='ask'?'none':''}
function setHash(){var h=S.view==='ask'?'ask':S.view==='map'?('map'+(S.mlvl>=1?'-'+S.mdom:'')+(S.mlvl===2?'-'+S.mproc:'')):S.view==='proc'?'p-'+S.pid:'c-'+S.cid;try{if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h)}catch(e){}}
function render(enter){
 renderTop();var m=$('main');m.className='wrap'+(enter?' enter':'');
 if(S.view==='ask')m.innerHTML=askHtml();
 else if(S.view==='map'){m.innerHTML=mapHtml();setCamStyle(false);syncLevelUI();bindGestures()}
 else if(S.view==='proc')m.innerHTML=procHtml(proc(S.pid));
 else m.innerHTML=claimHtml(cl(S.cid));

function go(v,o){o=o||{};S.view=v;if(o.cid)S.cid=o.cid;if(o.pid)S.pid=o.pid;closePeek();render(true);if(o.scrollTo){setTimeout(function(){var e=$(o.scrollTo);if(e)e.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})},80)}else window.scrollTo(0,0)}
function goMap(lvl,d,p){S.view='map';S.mlvl=0;S.mdom=null;S.mproc=null;S.mclaim=null;S.cam={x:200,y:200,s:1};closePeek();render(true);window.scrollTo(0,0);if(lvl>0){requestAnimationFrame(function(){requestAnimationFrame(function(){setLvl(lvl,d,p)})})}}
function openPeek(name){
 var pr=procByName(name),p=pr?['Process in '+dom(pr.d).n,pr.w+' '+claimsOf(pr.id).length+' things Asoka knows.']:(PEEK[name]||['Related','More about '+name+'.']);
 $('peek').innerHTML='<div class="card"><div class="pk">'+esc(p[0])+'</div><h3>'+esc(name)+'</h3><p>'+esc(p[1])+'</p>'+(pr?'<button class="openp2 press" data-act="openp" data-v="'+pr.id+'">Open '+esc(pr.n)+'</button>':'')+'<button class="px press" data-act="unpeek" aria-label="Close">×</button></div>';$('peek').classList.add('on');$('scrim').classList.add('on');
}
function closePeek(){$('peek').classList.remove('on');$('scrim').classList.remove('on')}

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
 if(Date.now()-dragged<250&&b.closest('#msvg'))return;
 if(a==='home'){S.ans=null;S.q='';go('ask')}
 else if(a==='ask')doAsk($('qin').value);
 else if(a==='sug')doAsk(v);
 else if(a==='fask'){var x=$('fin').value;$('fin').value='';doAsk(x)}
 else if(a==='stopask'){askSeq++;if(askCtl){try{askCtl.abort()}catch(err){}}if(S.ans){S.ans.pending=false;if(S.ans.unknown&&S.asked.indexOf(S.q)<0)S.asked.push(S.q)}render(false)}
 else if(a==='map'||a==='cr0'){if(S.view==='map')setLvl(0,null,null);else goMap(0)}
 else if(a==='cr1'){if(S.view==='map')setLvl(1,v,null);else goMap(1,v)}
 else if(a==='cr2'){var p2=proc(v);if(S.view==='map')setLvl(2,p2.d,v);else goMap(2,p2.d,v)}
 else if(a==='mapHere'){var cp=curProc();if(S.view==='claim'){var cc=cl(S.cid);goMap(2,proc(cc.p).d,cc.p);setTimeout(function(){S.mclaim=cc.id;syncLevelUI()},760)}else if(cp)goMap(2,cp.d,cp.id);else goMap(0)}
 else if(a==='mdom')setLvl(1,id,null);
 else if(a==='mproc'){var pp=proc(id);setLvl(2,pp.d,id)}
 else if(a==='mclaim'){S.mclaim=id;syncLevelUI()}
 else if(a==='zout'){if(S.mclaim){S.mclaim=null;syncLevelUI()}else if(S.mlvl===2)setLvl(1,S.mdom,null);else setLvl(0,null,null)}
 else if(a==='fly')flyTo(1,b.dataset.d,null);
 else if(a==='flyp'){var q=proc(id);flyTo(2,q.d,q.id)}
 else if(a==='openp'){S.blast=false;go('proc',{pid:v||id})}
 else if(a==='openblast'){S.blast=true;go('proc',{pid:v,scrollTo:'blastsec'})}
 else if(a==='claim')go('claim',{cid:id||v});
 else if(a==='blast'){S.blast=!S.blast;render(false);if(S.blast)setTimeout(function(){var el=$('blastsec');if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})},40)}
 else if(a==='watch'){S.watch[id]=true;render(false);toast('You’ll get a Slack note when '+proc(id).n.toLowerCase()+' changes.')}
 else if(a==='findout'){S.unk[id]=true;toast('Asoka will ask the person most likely to know.');if(S.view==='map')$('mcap').innerHTML=capHtml();else render(false)}
 else if(a==='peek')openPeek(v);
 else if(a==='unpeek')closePeek();
});
document.addEventListener('input',function(e){
 if(e.target.dataset.inp!=='tt')return;var c=cl(e.target.dataset.id),i=+e.target.value,vv=c.hist[i];S.tt[c.id]=i;
 $('ttd').textContent=vv.d;var tv=$('ttv');tv.textContent=vv.t;tv.style.animation='none';void tv.offsetWidth;tv.style.animation='';
 $('ttw').textContent='What changed it: '+vv.w;var bd=$('ttb');bd.textContent=i<c.hist.length-1?'What we believed then':'Now';bd.className='ttbadge'+(i<c.hist.length-1?' then':'');
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.id==='qin'){e.preventDefault();doAsk(e.target.value)}
 if(e.key==='Enter'&&e.target.id==='fin'){e.preventDefault();var x=e.target.value;e.target.value='';doAsk(x)}
 if(e.key==='Escape'){if($('peek').classList.contains('on'))closePeek();else if(S.view==='map'&&S.mlvl>0){var zb=document.querySelector('[data-act="zout"]');if(zb)zb.click()}}
});
window.addEventListener('scroll',function(){$('hd').classList.toggle('sc',window.scrollY>4)},{passive:true});
(function(){
 var h=location.hash.slice(1),m;
 if((m=h.match(/^p-(\w+)$/))&&proc(m[1])){S.view='proc';S.pid=m[1]}
 else if((m=h.match(/^c-(\w+)$/))&&cl(m[1])){S.view='claim';S.cid=m[1]}
 else if((m=h.match(/^map(?:-(\w+))?(?:-(\w+))?$/))){S.view='map';if(m[1]&&dom(m[1])){S.mlvl=1;S.mdom=m[1]}if(m[2]&&proc(m[2])){S.mlvl=2;S.mproc=m[2]}S.cam=camFor()}
 render(true);
})();
})();
