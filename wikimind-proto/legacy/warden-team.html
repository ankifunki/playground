<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warden: your agent team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#EDF0F4;--panel:#FFFFFF;--panel2:#F5F7FA;--ink:#131A25;--ink2:#566072;--line:#D8DEE6;--accent:#2F3FBF;
 --ok:#0A7466;--okb:#D9F2EC;--warn:#B07300;--warnb:#FAE9C6;--bad:#B3302D;--badb:#FBE2E0;--ub:#E4E8FB;
 --iris-bg:#E4E8FB;--iris-fg:#2F3FBF;--sol-bg:#D9F2EC;--sol-fg:#0A7466;--fen-bg:#FAE9C6;--fen-fg:#8F5A00;--pia-bg:#FBE4EF;--pia-fg:#A23767;
 --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
 --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#0E131A;--panel:#161D27;--panel2:#1B2431;--ink:#E8ECF2;--ink2:#9AA5B6;--line:#2A3442;--accent:#9AA6FF;
  --ok:#6FD8C6;--okb:#113A34;--warn:#F0C068;--warnb:#42320E;--bad:#FF908B;--badb:#47201F;--ub:#222A55;
  --iris-bg:#222A55;--iris-fg:#AEB8FF;--sol-bg:#113A34;--sol-fg:#6FD8C6;--fen-bg:#42320E;--fen-fg:#F0C068;--pia-bg:#4A1E33;--pia-fg:#F4A3C8;
  color-scheme:dark;
 }
}
:root[data-theme="dark"]{
 --bg:#0E131A;--panel:#161D27;--panel2:#1B2431;--ink:#E8ECF2;--ink2:#9AA5B6;--line:#2A3442;--accent:#9AA6FF;
 --ok:#6FD8C6;--okb:#113A34;--warn:#F0C068;--warnb:#42320E;--bad:#FF908B;--badb:#47201F;--ub:#222A55;
 --iris-bg:#222A55;--iris-fg:#AEB8FF;--sol-bg:#113A34;--sol-fg:#6FD8C6;--fen-bg:#42320E;--fen-fg:#F0C068;--pia-bg:#4A1E33;--pia-fg:#F4A3C8;
 color-scheme:dark;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:20}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{font-weight:600;font-size:18px;letter-spacing:-.01em}
.pulse{font-size:13.5px;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit}
.btn{font-size:14px;font-weight:500;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;min-height:36px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.stop{color:var(--bad);border-color:var(--bad)}
.back{background:none;border:0;font-weight:500;font-size:15px;cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:4px}
.lnk{background:none;border:0;color:var(--ink2);font-size:13.5px;text-decoration:underline;cursor:pointer;padding:6px 4px;min-height:32px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{font-size:13px;color:var(--ink2);padding:0 0 8px}
.demo summary{cursor:pointer;list-style:none;padding:2px 0}
.demo summary::-webkit-details-marker{display:none}
.demo div{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.demo .btn{font-size:13px;min-height:30px;padding:3px 10px}
main{padding:18px 0 150px}
h2{font-size:15px;font-weight:600;color:var(--ink2);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mate{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-width:0}
.mate:hover{border-color:var(--ink2)}
.mate .nm{font-weight:600;font-size:17px;line-height:1.2}
.mate .rl{font-size:13px;color:var(--ink2)}
.mate .ln{font-size:13.5px;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.avw{position:relative;display:inline-block;line-height:0;flex:none}
.badge{position:absolute;top:-2px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--warn);color:var(--panel);font-size:12px;font-weight:600;line-height:20px;text-align:center;padding:0 5px}
.ring{transition:stroke .2s}
.ring.think{stroke-dasharray:22 9;animation:spin 1.2s linear infinite}
@keyframes spin{to{stroke-dashoffset:-124}}
@media (prefers-reduced-motion:reduce){.ring.think{animation:none}}
.nt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.nt .tx{flex:1;min-width:0}
.nt .tt{font-weight:500;font-size:15px;line-height:1.35}
.nt .sb{font-size:13px;color:var(--ink2)}
.ahead{display:flex;flex-direction:column;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ahead .row1{display:flex;gap:14px;align-items:center}
.ahead h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.015em;line-height:1.1}
.ahead .rl{color:var(--ink2);font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ai{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--ink2)}
.ahead .ln{margin-top:6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-top:6px}
.facts span:nth-child(odd){color:var(--ink2)}
.a,.u,.card,.rc{margin:0 0 12px}
.a{max-width:90%;white-space:pre-wrap}
.wh{display:block;font-size:12.5px;color:var(--ink2);font-weight:500;margin-bottom:1px}
.u{max-width:80%;margin-left:auto;background:var(--ub);border-radius:14px 14px 4px 14px;padding:8px 13px}
.rc{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.rc span{color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.nl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.kd{font-size:12px;font-weight:500;padding:1px 7px;border-radius:4px;background:var(--panel2);color:var(--ink2)}
.kd.ask{background:var(--warnb);color:var(--warn)}.kd.unless{background:var(--ub);color:var(--accent)}
.src{font-size:12.5px;color:var(--ink2)}
.when{font-size:13.5px;color:var(--accent);margin-top:8px;font-weight:500}
.ih{display:flex;align-items:center;gap:8px}
.t{font-weight:600;font-size:16.5px;line-height:1.35}
.w{color:var(--ink2);margin-top:4px;font-size:15px}
.tag{font-size:12px;padding:1px 7px;border-radius:4px;background:var(--okb);color:var(--ok);font-weight:500;margin-left:auto}
.tag.s{background:var(--warnb);color:var(--warn)}
.ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14.5px}
.btns{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.res{margin-top:10px;font-size:14px;color:var(--ink2)}
.rule{margin-top:8px;font-size:13.5px;color:var(--ink2)}
.rule summary{cursor:pointer}
.rule code{display:block;margin-top:6px;font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre}
.rlist{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px;margin-top:10px}
.rlist em{font-style:normal;color:var(--ink2);text-align:right}
.typing{display:flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink2);opacity:.5;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.bar{display:flex;gap:8px;padding-bottom:12px}
.bar input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:0 16px;height:44px}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ic.go{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .15s;z-index:30;cursor:pointer}
#toast.on{opacity:1;pointer-events:auto}
.bh .row1{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.bh h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.015em;line-height:1.15}
.bh .rl{color:var(--ink2);font-size:14px;margin-top:3px}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;flex-direction:column;gap:1px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .st{font-weight:600;font-size:16px}
details.sec>summary .ss{font-size:13.5px;color:var(--ink2)}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.sb2{padding:8px 8px 10px}
.pk{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:7px 8px;cursor:pointer;font-size:15px;line-height:1.4}
.pk:hover{background:var(--panel2)}
.pk.on{border-color:var(--accent);background:var(--ub)}
.pk .x{flex:1;min-width:0}
.pt{font-size:11.5px;font-weight:500;padding:0 6px;border-radius:4px;background:var(--panel2);color:var(--ink2);white-space:nowrap;border:1px solid var(--line)}
.pt.h{background:var(--warnb);color:var(--warn);border-color:transparent}
.pt.l{background:var(--ub);color:var(--accent);border-color:transparent}
.sop{padding:6px 0 10px;border-top:1px solid var(--line)}
.sop:first-child{border-top:0}
.trg,.meta{font-size:13.5px;color:var(--ink2);padding:0 8px}
.sop ol{margin:4px 0;padding-left:26px}
.sop ol li::marker{color:var(--ink2);font-size:13px}
.lvp{font-size:12px;font-weight:500;padding:1px 7px;border-radius:4px;white-space:nowrap}
.lvp.read{background:var(--panel2);color:var(--ink2)}.lvp.propose{background:var(--ub);color:var(--accent)}.lvp.act{background:var(--okb);color:var(--ok)}
.sc{font-size:13px;color:var(--ink2)}
.diff{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.diff .d{color:var(--bad)}.diff .p{color:var(--ok)}
.hi{display:flex;gap:10px;align-items:center;padding:6px 8px;font-size:14.5px}
.hi .x{flex:1}
.hi time{font-size:12.5px;color:var(--ink2);font-family:var(--mono);min-width:48px}
.chip.fc{background:var(--ub);border-color:var(--accent);color:var(--accent);max-width:280px;overflow:hidden;text-overflow:ellipsis}
.tlog{list-style:none;margin:6px 0 18px 7px;padding:0 0 0 20px;border-left:2px solid var(--line)}
.tlog li{position:relative;padding:0 0 16px 4px}
.tlog li::before{content:"";position:absolute;left:-28px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--ink2)}
.tlog li.bk::before{border-color:var(--bad);background:var(--bad)}
.tlog li.ok::before{border-color:var(--ok)}
.tlog li.you::before{border-color:var(--accent);background:var(--accent)}
.tlog .k{font-weight:600;font-size:14.5px}
.tlog .tm{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-left:8px}
.tlog .d{font-size:15px;line-height:1.45}
.tlog .who{font-size:12.5px;color:var(--ink2)}
.wrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.wrow:hover{border-color:var(--ink2)}
.wrow time{font-family:var(--mono);font-size:12px;color:var(--ink2);min-width:44px}
.wrow .x{flex:1;min-width:0;font-size:15px}
.st2{font-size:12px;font-weight:500;padding:1px 7px;border-radius:4px;white-space:nowrap;background:var(--okb);color:var(--ok)}
.st2.Blocked{background:var(--badb);color:var(--bad)}.st2.wait{background:var(--warnb);color:var(--warn)}.st2.Undone{background:var(--panel2);color:var(--ink2)}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--ink2);margin-top:4px}
:root{
 --bg:#F4F5F2;--panel:#FFFFFF;--panel2:#EEF1EC;--ink:#1E2724;--ink2:#5E6A65;--line:#E3E7E2;--accent:#4353C6;--ub:#E9ECFB;
 --ok:#1E8467;--okb:#E1F3EC;--warn:#B06E12;--warnb:#FCF0DA;--bad:#C2423B;--badb:#FBE6E3;
 --iris-bg:#E8EBFC;--iris-fg:#4353C6;--sol-bg:#DFF3EC;--sol-fg:#1E8467;--fen-bg:#FCEFD8;--fen-fg:#A86A12;--pia-bg:#FBE6EF;--pia-fg:#B2457A;
 --sh:0 1px 2px rgba(25,40,32,.05),0 6px 20px rgba(25,40,32,.06);
 --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#121614;--panel:#1B201E;--panel2:#232A27;--ink:#ECEFEC;--ink2:#A1ACA7;--line:#2C3431;--accent:#9EA9FF;--ub:#262C52;
  --ok:#6FD3B4;--okb:#16362D;--warn:#F0C36B;--warnb:#3D3016;--bad:#FF9A92;--badb:#44221F;
  --iris-bg:#262C52;--iris-fg:#AEB8FF;--sol-bg:#16362D;--sol-fg:#6FD3B4;--fen-bg:#3D3016;--fen-fg:#F0C36B;--pia-bg:#43202F;--pia-fg:#F2A6C6;
  --sh:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);
 }
}
:root[data-theme="dark"]{
 --bg:#121614;--panel:#1B201E;--panel2:#232A27;--ink:#ECEFEC;--ink2:#A1ACA7;--line:#2C3431;--accent:#9EA9FF;--ub:#262C52;
 --ok:#6FD3B4;--okb:#16362D;--warn:#F0C36B;--warnb:#3D3016;--bad:#FF9A92;--badb:#44221F;
 --iris-bg:#262C52;--iris-fg:#AEB8FF;--sol-bg:#16362D;--sol-fg:#6FD3B4;--fen-bg:#3D3016;--fen-fg:#F0C36B;--pia-bg:#43202F;--pia-fg:#F2A6C6;
 --sh:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);
}
body{font-size:16.5px;line-height:1.55;font-family:var(--sans)}
body::before{background:var(--bg)}
header{background:var(--bg);border-bottom:0}
.top{padding:14px 0 8px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em}
header .btn{min-height:34px;padding:6px 14px;font-size:13.5px}
.demo{font-size:12.5px;padding:0 0 6px}
.demo summary{color:var(--ink2);opacity:.8}
main{padding:10px 0 160px}
.btn{border:0;background:var(--panel2);border-radius:999px;padding:9px 18px;min-height:40px;font-weight:600;transition:background .15s}
.btn:hover{background:var(--line);border-color:transparent}
.btn.pri{background:var(--ink);color:var(--panel)}
.btn.pri:hover{background:var(--ink);opacity:.9}
.btn.stop{background:var(--badb);color:var(--bad)}
.lnk{text-decoration:none;color:var(--accent);font-weight:600}
.lnk:hover{text-decoration:underline}
.back{font-weight:600}
.greet{padding:14px 0 18px}
.greet h1{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.15;margin:0}
.greet p{color:var(--ink2);font-size:17px;margin:6px 0 0;max-width:30em}
h2{color:var(--ink);font-size:17px;font-weight:600;margin:32px 0 12px;letter-spacing:-.01em}
.grid{gap:12px}
.mate{border:0;box-shadow:var(--sh);border-radius:22px;padding:18px 16px 16px;gap:12px;transition:transform .15s}
.mate:hover{transform:translateY(-2px)}
.mate .nm{font-size:18px}
.mate .ln{color:var(--ink2);font-size:14.5px}
.ring{stroke-width:2px}
.badge{top:0;right:-2px;background:var(--warn);box-shadow:0 0 0 3px var(--panel)}
.nt,.wrow{border:0;box-shadow:var(--sh);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.nt .sb{font-size:13.5px}
.card{border:0;box-shadow:var(--sh);border-radius:20px;padding:18px}
.a{font-size:16.5px}
.wh{font-weight:600}
.u{background:var(--ub);border-radius:20px 20px 6px 20px;padding:10px 15px}
.rc{font-size:14px}
.nl{margin-bottom:4px}
.kd,.kd.ask,.kd.unless{background:none;padding:0;font-size:13px;font-weight:600;border-radius:0}
.kd.ask{color:var(--warn)}.kd.unless{color:var(--accent)}
.src{font-size:13px}
.t{font-size:17.5px;letter-spacing:-.01em}
.w{font-size:15.5px}
.when{font-weight:600}
.res{font-weight:500}
.btns{margin-top:14px}
.tag,.st2{background:none!important;padding:0;font-size:13px;font-weight:600}
.st2.Blocked{color:var(--bad)}.st2.wait{color:var(--warn)}.st2.Undone{color:var(--ink2)}
.pt{border:0;font-size:12px;padding:1px 8px;border-radius:999px}
.lvp{border-radius:999px;padding:2px 10px}
.ahead{border-bottom:0;padding:6px 0 10px;margin-bottom:14px}
.ahead h1{font-size:30px;letter-spacing:-.025em}
.ai{border:0;background:var(--panel2);border-radius:999px;padding:1px 9px}
.facts{background:var(--panel);box-shadow:var(--sh);border-radius:18px;padding:14px 16px;margin-top:12px;gap:6px 16px}
.bh h1{font-size:27px;letter-spacing:-.025em}
details.sec{border:0;box-shadow:var(--sh);border-radius:20px;margin-bottom:12px}
details.sec>summary{padding:16px 18px}
details.sec[open]>summary{border-bottom:0;padding-bottom:6px}
.sb2{padding:0 10px 12px}
.pk{border-radius:12px;padding:8px 10px}
.sop{border-top:0;padding:8px 0 12px}
.sop+.sop{border-top:1px solid var(--line)}
.rule code,.diff{border:0;background:var(--panel2);border-radius:12px;padding:10px 12px}
.diff{font-family:var(--sans);font-size:14.5px}
.mono,.wrow time,.tlog .tm,.hi time{font-family:var(--sans);font-variant-numeric:tabular-nums}
.tlog{border-left-color:var(--line);margin-left:8px}
.tlog li::before{border-width:2px;width:12px;height:12px;left:-29px;top:4px}
.tlog .k{font-size:15px}
.chips{padding:12px 0 10px}
.chip{border:0;background:var(--panel);box-shadow:var(--sh);padding:8px 15px;font-weight:500}
.chip.fc{border:0;background:var(--ub)}
.bar input{border:0;box-shadow:var(--sh);height:50px;border-radius:25px;padding:0 20px}
.ic{border:0;box-shadow:var(--sh);width:50px;height:50px}
#toast{border-radius:999px;padding:10px 18px;box-shadow:var(--sh)}
.gsvg{display:block;max-width:440px;margin:6px auto 0;overflow:visible}
.gn text{pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;color:var(--ink2);margin:2px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;margin-right:6px;vertical-align:-1px}
.cap{background:var(--panel2);border-radius:16px;padding:14px 16px;margin-top:4px}
.cap-k{font-size:12.5px;color:var(--ink2);font-weight:600}
.cap-t{font-weight:600;font-size:16.5px;letter-spacing:-.01em}
.stages{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 8px}
.stages::-webkit-scrollbar{display:none}
.stg{border:0;background:none;color:var(--ink2);font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;opacity:.6}
.stg.done{opacity:1;color:var(--ink)}
.stg.on{opacity:1;background:var(--ink);color:var(--panel)}
.radar{display:flex;justify-content:center;margin:4px 0 6px}
.dial{padding:12px 2px 10px;border-top:1px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dn{font-weight:600}
.dv{color:var(--ink2);font-size:14.5px;text-align:right}
.dial input{width:100%;accent-color:var(--accent);margin:8px 0 2px}
.de{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.imp-h{font-weight:600;margin:16px 0 4px;font-size:15px}
.imp{display:flex;flex-direction:column;padding:5px 0}
.imp b{font-weight:500;font-size:15.5px}
.imp small{color:var(--ink2);font-size:13.5px}

function go(id){
 stopWalk();S.walk=null;S.gsel=null;S.draft=null;S.profMsg=null;if(id.indexOf('trace:')===0&&!isTrace())S.traceBack=S.view;S.view=id;S.focus=null;try{location.hash=id.replace(':b','-brain').replace(':log','-log').replace('trace:','trace-')}catch(e){}
 render(false);window.scrollTo(0,0);
}

function proactive(manual){
 if(S.pi>=POOL.length){if(manual)toast('Nothing new right now. The team is quiet.');return}
 var item=POOL[S.pi++],a=ag(item.agent);
 if(a.paused){if(manual)toast(a.name+' is paused, so it’s not watching for changes.');return}
 if(a.spoke>=a.budget){a.saved++;render(false);if(manual)toast(a.name+' saved something for your digest.');return}
 S.thinking=a.id;render(false);
 setTimeout(function(){
  S.thinking=null;a.spoke++;
  var n={k:'note'};for(var key in item)n[key]=item[key];
  post(a.id,n);
  if(S.view!==a.id)toast(a.name+' noticed something. Tap to see.',a.id);
 },1500);
}

function noteGo(a,m,yes){
 if(m.res)return;
 if(m.kind==='fyi'){m.res='Noted';render(false);return}
 if(m.kind==='ask'){
  if(yes){m.res='Approved';m.w=unitForNote(a,m,'You said yes.');rcpt(a.id,'Done: '+m.done,m.w);if(m.lesson)a.lessons.push(m.lesson);if(m.fact)S.facts.push(m.fact);if(m.clear)a.flag=null}
  else{m.res='Declined';say(a,'Okay. I won’t suggest this again unless something changes.')}
 }else{
  if(yes){m.res='Going ahead';m.w=unitForNote(a,m,'You said go ahead.');rcpt(a.id,m.done,m.w);if(m.lesson)a.lessons.push(m.lesson)}
  else{m.res='Stopped';say(a,'Okay, I won’t do it. I’ll ask before trying anything like it again.')}
 }
 render(false);
}

function startOnboard(tool){
 S.flow={tool:tool};
 fleetSay(tool+', got it. One question: who will use it, and should the team only read it, or also act in it?');
}
function onboardAnswer(l){
 var tool=S.flow.tool;S.flow=null;
 var mode=/\bact\b|write|change|edit/.test(l)?'act':'read';
 var aud=/\beveryone\b|\ball\b|company/.test(l)?'all':/financ|spend|account/.test(l)?'fin':/people|\bhr\b|hiring/.test(l)?'ppl':'eng';
 var map={eng:['iris','sol'],all:['iris','sol','pia'],fin:['fen','sol'],ppl:['pia','iris']};
 post('team',{k:'plan',tool:tool,mode:mode,aud:aud,agents:map[aud]});
}
function planGo(m,yes){
 if(m.res)return;
 if(!yes){m.res='Not rolled out';S.flow={tool:m.tool};fleetSay('Okay. Tell me who should use '+m.tool+', and whether the team reads or acts, and I’ll redo the plan.');render(false);return}
 m.res='Rolling out';
 var R={tool:m.tool,mode:m.mode,agents:m.agents,stage:0};
 S.rollouts.push(R);
 var first=ag(R.agents[0]);first.tools.push(R.tool);
 S.facts.push(R.tool+': '+({eng:'engineering',all:'company-wide',fin:'finance',ppl:'people team'}[m.aud])+' tool, added by you');
 post('team',{k:'rollout',ref:R});
 fleetSay('Added '+R.tool+' to shared knowledge, so everyone knows what it is and who owns it.');
 setTimeout(function(){post(first.id,{k:'note',kind:'fyi',src:'new tool: '+R.tool,title:'Watching how '+R.tool+' gets used',why:'I’m connected read-only. I’ll learn the patterns for a week before suggesting anything.'})},1800);
 if(R.agents.indexOf('sol')>0){
  setTimeout(function(){
   post('sol',{k:'note',kind:'ask',src:'new tool: '+R.tool,title:'Audit-log access for '+R.tool+'?',why:'So I can review what happens in it before it goes live for me. Read-only.',done:'I can read the '+R.tool+' audit log.'});
   if(S.view!=='sol')toast('Sol needs something for '+R.tool+'. Tap to see.','sol');
  },3600);
 }
 render(false);
}
function skipDay(){
 var R=S.rollouts.filter(function(r){return r.stage===0})[0];
 if(!R){toast('No rollout is waiting on a clean day.');return}
 R.stage=1;R.agents.slice(1).forEach(function(id){ag(id).tools.push(R.tool)});
 fleetSay('Clean day. '+R.tool+' is now connected for '+R.agents.slice(1).map(function(id){return ag(id).name}).join(' and ')+' too. Nothing in it can act on its own yet.');
 render(false);
}
function startRevoke(name){
 var key=name.toLowerCase(),hold=[],real=null;
 A.forEach(function(a){a.tools.forEach(function(t){if(t.toLowerCase()===key){real=t;if(hold.indexOf(a.id)<0)hold.push(a.id)}})});
 if(!hold.length){fleetSay('Nobody on the team has access to '+name+'. Nothing to revoke.');return}
 post('team',{k:'revoke',tool:real,holders:hold});
}
function revokeGo(m,yes){
 if(m.res)return;
 if(!yes){m.res='Kept';render(false);return}
 m.res='Revoked';
 A.forEach(function(a){a.tools=a.tools.filter(function(t){return t!==m.tool})});
 S.facts=S.facts.filter(function(f){return f.indexOf(m.tool)<0});
 rcpt('team','Revoked '+m.tool+' for '+m.holders.map(function(i){return ag(i).name}).join(' and ')+'. Audit history kept.');
 render(false);
}
function ruleFrom(l){
 var m;
 if(m=l.match(/(?:never|no|don[’']?t).*?(?:on|during)\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?/))return {rule:'No changes on '+cap1(m[1])+'s',code:'change_window: exclude '+m[1].slice(0,3)};
 if(m=l.match(/(?:never|don[’']?t)\s+touch\s+(.+?)[.!?]*$/))return {rule:'Never touch '+m[1],code:'boundaries.protected += "'+m[1]+'"'};
 return null;
}
function gruleGo(k,m,yes){
 if(m.res)return;
 if(!yes){m.res='Not applied';render(false);return}
 m.res='Applied';S.rules.push(m);
 rcpt(k,'Rule added for '+(m.scope.length===A.length?'the whole team':ag(m.scope[0]).name)+': '+m.rule+'.');
 render(false);
}
function resolve(k,m,yes){
 if(!m)return;
 if(m.k==='note')noteGo(ag(k),m,yes);
 else if(m.k==='plan')planGo(m,yes);
 else if(m.k==='revoke')revokeGo(m,yes);
 else if(m.k==='grule')gruleGo(k,m,yes);
}
function pause(a,on){
 a.paused=on;
 if(on)say(a,'Paused. Nothing runs until you resume me.');else say(a,'Back at it.');
 render(false);
}

function handleTeam(t){
 user('team',t);
 var l=t.toLowerCase(),m,who=named(t),allw=/everything|\ball\b|team|everyone|everybody/.test(l);
 if(S.flow){if(/^(cancel|never ?mind)/.test(l)){S.flow=null;fleetSay('Okay, dropped.');return}onboardAnswer(l);return}
 if(/^(yes|yep|yeah|ok|okay|sure|do it|go ahead|approve|roll it out)\b/.test(l)||/^(no|nope|not yet|skip|cancel|hold off|change)\b/.test(l)){
  var yes=/^(yes|yep|yeah|ok|okay|sure|do it|go ahead|approve|roll it out)\b/.test(l),p=fleetPend();
  if(!p.length){fleetSay('Nothing here is waiting on you. Check the people with a badge.');return}
  if(p.length>1){fleetSay('Two things are waiting. Tap the one you mean, so nothing is approved by mistake.');return}
  resolve('team',p[0],yes);return;
 }
 if(/\b(trace|audit|log|logs|who did|what happened)\b/.test(l)){var qq=t.replace(/.*?\b(trace|audit|logs?|who did|what happened)\b(\s+(to|with|on|for|of))?\s*/i,'').replace(/^the\s+/i,'').replace(/[?.!]+$/,'').trim();if(who&&(!qq||who.re.test(qq)||(who.reCS&&who.reCS.test(qq)))){S.q='';go(who.id+':log')}else{S.q=qq;go('all:log')}return}
 if(who&&/\b(open|talk to|go to|show|see)\b/.test(l)){go(who.id);return}
 if(/\b(stop|pause|freeze|halt)\b/.test(l)){
  if(who&&!allw){pause(who,true);fleetSay(who.name+' is paused.');return}
  A.forEach(function(a){a.paused=true});fleetSay('Everyone is paused. Nothing runs until you resume.');render(false);return;
 }
 if(/\b(resume|unpause|start again)\b/.test(l)){
  if(who&&!allw){pause(who,false);fleetSay(who.name+' is back.');return}
  if(!A.some(function(a){return a.paused})){fleetSay('Everyone is already working.');return}
  fleetSay('Resuming the whole team needs a second person. I’ve asked Dev.');
  setTimeout(function(){A.forEach(function(a){a.paused=false});fleetSay('Dev confirmed. Everyone is back.');render(false)},2400);return;
 }
 if((m=t.match(/\b(?:onboard|connect|set up|bring in)\s+(?:the\s+|new\s+)?(?:tool\s+|vendor\s+)?([A-Za-z][A-Za-z0-9.\-]*)/i)||t.match(/\badd\s+(?:the\s+)?(?:new\s+)?(?:tool|vendor)\s+([A-Za-z][A-Za-z0-9.\-]*)/i))&&!/^(a|an|the|that|this|it|rule|everything|new|my)$/i.test(m[1])){startOnboard(cap1(m[1]));return}
 if((m=t.match(/\b(?:offboard|drop|revoke|retire|remove)\s+(?:the\s+)?(?:vendor\s+|tool\s+|access\s+to\s+)?([A-Za-z][A-Za-z0-9.\-]*)/i))&&!/^(a|an|the|that|this|it|everything|my)$/i.test(m[1])){startRevoke(m[1]);return}
 var r=ruleFrom(l);
 if(r){r.k='grule';r.scope=A.map(function(a){return a.id});post('team',r);return}
 if(/\b(never|don[’']?t)\b/.test(l)){fleetSay('I couldn’t turn that into a precise rule. Say it with a day, a system, or a person, like “never touch the finance team.”');return}
 if(/knowledge|facts|what do (you|we) know|shared/.test(l)){post('team',{k:'facts'});return}
 if(/need|status|how(’s|'s| is| are)|doing|going|today/.test(l)){
  var c=A.reduce(function(s,a){return s+agentPend(a).length},0)+fleetPend().length;
  fleetSay(c?c+' thing'+(c>1?'s':'')+' need you. Look for the badges above.':'Nothing needs you right now.');return;
 }
 if(who){go(who.id);return}
 fleetSay('I can onboard or remove a tool for the team, pause or resume anyone, add a rule for everyone, or open a teammate. Tap a face to talk to one directly.');
}
function handleAgent(a,t){
 user(a.id,t);
 var l=t.toLowerCase();
 var r=ruleFrom(l);
 if(/\b(log|trace|audit|what happened)\b/.test(l)){S.q='';go(a.id+':log');return}
 if(r){r.k='grule';r.scope=[a.id];post(a.id,r);return}
 if(/^(yes|yep|yeah|ok|okay|sure|do it|go ahead|approve)\b/.test(l)||/^(no|nope|not yet|skip|don[’']?t|hold off|stop it)\b/.test(l)){
  var yes=/^(yes|yep|yeah|ok|okay|sure|do it|go ahead|approve)\b/.test(l),p=agentPend(a);
  if(!p.length){say(a,'Nothing is waiting on you.');return}
  if(p.length>1){say(a,'Two things are waiting. Tap the one you mean, so nothing is approved by mistake.');return}
  resolve(a.id,p[0],yes);return;
 }
 if(/\b(stop|pause|freeze)\b/.test(l)){if(/everything|everyone|\ball\b|team/.test(l)){go('team');handleTeam('pause everyone');return}pause(a,true);return}
 if(/\b(resume|unpause|start again)\b/.test(l)){pause(a,false);return}
 if(/learn/.test(l)){post(a.id,{k:'lessons'});return}
 if(/less|fewer|quiet|calm/.test(l)){a.budget=Math.max(1,a.budget-1);say(a,'Okay. I’ll speak up at most '+a.budget+' time'+(a.budget>1?'s':'')+' a day and save the rest for a daily digest.');render(false);return}
 if(/\bmore\b|proactive/.test(l)){a.budget=Math.min(6,a.budget+1);say(a,'Okay, up to '+a.budget+' times a day.');render(false);return}
 if(/^why|why\?|tell me more|explain/.test(l)){
  var n=a.msgs.filter(function(m){return m.k==='note'}).slice(-1)[0];
  if(n){say(a,'I picked this up from '+n.src+'. '+n.why);return}
  say(a,'Ask me about something I did or suggested.');return;
 }
 if(/what did|today|doing|status|how/.test(l)){say(a,a.line+' Recently: '+a.recent.join('; ').toLowerCase()+'.');return}
 if(/\b(never|don[’']?t)\b/.test(l)){say(a,'I couldn’t turn that into a precise rule. Give me a day, a system, or a person.');return}
 say(a,'I can tell you what I’ve done or learned, take a rule for myself, speak up more or less, or pause. Anything that changes the whole team goes through the team chat.');
}

function sim(k){
 if(k==='notice')proactive(true);
 if(k==='day')skipDay();
 if(k==='alert'){
  var f=ag('fen');if(f.flag){toast('Already raised.');return}
  f.flag='Held 3 invoices: bank details changed.';
  post('fen',{k:'note',kind:'ask',src:'invoice checks',title:'Confirm bank changes for 3 vendors',why:'Each vendor changed bank details in the last 48 hours, so I held their invoices. Release only if you or the vendor confirmed by phone.',done:'Released 3 invoices after your check.',clear:true});
  if(S.view!=='fen')toast('Fen held 3 invoices. Tap to see.','fen');
  render(false);
 }
}

 var lab={ask:'Needs you',unless:'Will do unless you say no',fyi:'For your info'}[m.kind];

function tmS(t){return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function tmH(t){return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function isLog(){return /:log$/.test(S.view)}
function isTrace(){return S.view.indexOf('trace:')===0}
function logWho(){return S.view.split(':')[0]}
function unitById(id){return WORK.filter(function(u){return u.id===id})[0]}
function unitOf(){return unitById(S.view.slice(6))}
function stCls(s){return s==='Blocked'?'Blocked':s==='Undone'?'Undone':s==='Done'?'':'wait'}
function backOf(){

 else if(isLog()||isTrace()){top='<button class="back" data-act="go" data-id="'+backOf()+'" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back</button><span class="pulse"></span>'}
 else if(isBrain()){var ba=bAgent();top='<button class="back" data-act="go" data-id="'+ba.id+'" aria-label="Back to '+ba.name+'"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'+ba.name+'</button><span class="pulse"></span>'}
 else{var a=ag(S.view);top='<button class="back" data-act="go" data-id="team" aria-label="Back to team"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Team</button><span class="pulse"></span>'}
 top+='<button class="btn '+(allP?'':'stop')+'" data-act="stopall">'+(allP?'Resume all':'Stop all')+'</button>';
 $('top').innerHTML=top;
 $('main').innerHTML=S.view==='team'?teamHtml():isTrace()?traceHtml(unitOf()):isLog()?logHtml(logWho()):isBrain()?brainHtml(bAgent()):agentHtml(ag(S.view));
 $('in').placeholder=S.view==='team'?'Message the whole team':(isLog()||isTrace())?'Search the work log':isBrain()?'Tell '+bAgent().name+' what to change':'Message '+ag(S.view).name;
 chips();
 if(scroll)window.scrollTo(0,document.body.scrollHeight);
}
function send(v){
 v=(v||'').trim();if(!v)return;
 if(S.view==='team')handleTeam(v);else if(isLog()||isTrace())searchLog(v);else if(isBrain())brainEdit(bAgent(),v);else handleAgent(ag(S.view),v);
}

var rec=null;
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act;
 if(a==='go'){go(b.dataset.id)}
 else if(a==='toastgo'){if(S.lastToast){go(S.lastToast);$('toast').classList.remove('on')}}
 else if(a==='stopall'){var allP=A.every(function(x){return x.paused});if(S.view!=='team')go('team');handleTeam(allP?'resume everyone':'pause everyone')}
 else if(a==='send'){var v=$('in').value;$('in').value='';send(v)}
 else if(a==='chip'){send(b.dataset.v)}
 else if(a==='yes'||a==='no'){var k=b.dataset.t;resolve(k,thread(k)[+b.dataset.i],a==='yes')}
 else if(a==='agpause'){var g=ag(b.dataset.id);pause(g,!g.paused)}
 else if(a==='pick'){var pa=bAgent();S.focus={id:pa.id,sec:b.dataset.sec,i:+b.dataset.i,j:(b.dataset.j===''||b.dataset.j==null)?null:+b.dataset.j};render(false);$('in').focus()}
 else if(a==='unpick'){S.focus=null;render(false)}
 else if(a==='chg'){var ca=bAgent();chgGo(ca,ca.bmsgs[+b.dataset.i],b.dataset.v==='yes')}
 else if(a==='revert'){revert(bAgent(),+b.dataset.i)}
 else if(a==='clearq'){S.q='';render(false)}
 else if(a==='gnode'){stopWalk();S.walk=null;var gid=b.dataset.id;S.gsel=S.gsel===gid?null:gid;render(false)}
 else if(a==='gclear'){stopWalk();S.walk=null;S.gsel=null;render(false)}
 else if(a==='walk'){playWalk(bAgent())}
 else if(a==='walkstop'){stopWalk();S.walk=null;render(false)}
 else if(a==='stage'){stopWalk();if(S.walk){S.walk.i=+b.dataset.i;render(false)}}
 else if(a==='papply'){applyProf(bAgent())}
 else if(a==='preset'){S.draft=null;S.profMsg=null;render(false)}
 else if(a==='export'){toast('Copied '+b.dataset.id.toUpperCase()+' as JSON, with every step, actor, and timestamp.')}
 else if(a==='undo'){var uu=unitById(b.dataset.id);if(uu&&uu.status==='Done'){uu.status='Undone';uu.steps.push({k:'Undone',d:'You reversed it from this trace. Every change was rolled back.',who:'You',s:Math.round((now()-uu.ts)/1000)});toast('Undone. The trace keeps both.');render(false)}}
 else if(a==='sim'){sim(b.dataset.k)}
 else if(a==='mic'){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice input isn’t available in this view. Type instead.');return}
  if(rec){rec.stop();return}
  try{
   rec=new SR();rec.lang='en-US';rec.interimResults=false;
   rec.onresult=function(ev){send(ev.results[0][0].transcript)};
   rec.onerror=function(){toast('Couldn’t hear that. Try again or type.')};
   rec.onend=function(){rec=null;$('mic').classList.remove('on')};
   rec.start();$('mic').classList.add('on');
  }catch(x){rec=null;toast('Microphone is blocked here. Type instead.')}
 }
});
$('in').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var v=$('in').value;$('in').value='';send(v)}});
document.addEventListener('input',function(e){
 if(e.target.dataset.inp!=='dial'||!isBrain())return;
 var a=bAgent(),k=e.target.dataset.k;
 if(!S.draft||S.draft.id!==a.id)S.draft={id:a.id,v:Object.assign({},a.prof)};
 S.draft.v[k]=+e.target.value;S.profMsg=null;
 $('radar').innerHTML=radarSvg(a,a.prof,S.draft.v);
 $('dv-'+k).textContent=DIM(k).words[S.draft.v[k]-1];
 $('impact').innerHTML=impactHtml(a,a.prof,S.draft.v);
});
function viewFromHash(h){if(h==='team'||ag(h))return h;var mm=h.match(/^([a-z]+)-brain$/);if(mm&&ag(mm[1]))return mm[1]+':b';var ml=h.match(/^([a-z]+)-log$/);if(ml&&(ml[1]==='all'||ag(ml[1])))return ml[1]+':log';var mt=h.match(/^trace-(w\d+)$/);if(mt&&unitById(mt[1]))return 'trace:'+mt[1];return null}
window.addEventListener('hashchange',function(){var v=viewFromHash(location.hash.slice(1));if(v&&v!==S.view){S.view=v;S.focus=null;render(false);window.scrollTo(0,0)}});

var t0=now();
ag('sol').msgs.push({k:'note',kind:'ask',src:'failed-login spikes',title:'Read access to Okta sign-in logs?',why:'Three failed-login spikes this week. I need the logs to tell if they’re attacks. Read-only, 30 days.',done:'I can read Okta sign-in logs for 30 days.',ts:t0-40*60000});
ag('fen').msgs.push({k:'note',kind:'ask',src:'invoice match',title:'Pay the Acme invoice, $4,200?',why:'It matches PO-118 and Acme is approved, but the bank account on file is new. I want a person to confirm.',done:'Paid Acme $4,200 after your confirmation.',unit:'w1025',ts:t0-25*60000});
(function(){var v=viewFromHash(location.hash.slice(1));if(v)S.view=v})();
render(false);
setTimeout(function(){proactive(false)},8000);
setInterval(function(){proactive(false)},30000);
})();
