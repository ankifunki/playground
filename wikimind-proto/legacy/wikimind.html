<style>
:root{
 --bg:#F7F8F6;--panel:#FFFFFF;--panel2:#F0F2EF;--ink:#17201C;--ink2:#5B6661;--line:#E2E6E1;--accent:#4B45D6;--accb:#ECEBFC;
 --ver:#1E8467;--verb:#E1F3EC;--cor:#4B45D6;--corb:#ECEBFC;--one:#8A948F;--oneb:#EEF0EE;--gap:#B06E12;--gapb:#FCF0DA;
 --sh:0 1px 2px rgba(20,30,25,.05),0 8px 24px rgba(20,30,25,.06);
 --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --serif:"Geist Serif",Georgia,"Times New Roman",serif;
 color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#111513;--panel:#191E1C;--panel2:#212825;--ink:#ECEFEC;--ink2:#A2ADA8;--line:#2B3330;--accent:#A9A5FF;--accb:#26244A;
  --ver:#6FD3B4;--verb:#16362D;--cor:#A9A5FF;--corb:#26244A;--one:#8F9A95;--oneb:#262D2A;--gap:#F0C36B;--gapb:#3D3016;
  --sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);color-scheme:dark;
 }
}
:root[data-theme="dark"]{
 --bg:#111513;--panel:#191E1C;--panel2:#212825;--ink:#ECEFEC;--ink2:#A2ADA8;--line:#2B3330;--accent:#A9A5FF;--accb:#26244A;
 --ver:#6FD3B4;--verb:#16362D;--cor:#A9A5FF;--corb:#26244A;--one:#8F9A95;--oneb:#262D2A;--gap:#F0C36B;--gapb:#3D3016;
 --sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;height:58px}
.wm{display:flex;align-items:baseline;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.wm b{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.01em}
.wm span{font-size:13px;color:var(--ink2);font-weight:500}
.sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--ver);position:relative;flex:none}
.pdot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ver);opacity:0;animation:pd 2s ease-out infinite}
@keyframes pd{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.back{display:flex;align-items:center;gap:4px;background:none;border:0;font-weight:600;cursor:pointer;padding:6px 0}
main{padding:22px 0 190px}
.serif{font-family:var(--serif)}
/* ---------- home ---------- */
.date{font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:.01em}
.hero-h{font-family:var(--serif);font-weight:500;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 14px;max-width:16em}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:22px}
.stat b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--ink2)}
.hgrid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:900px){.hgrid{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:28px}}
.card{background:var(--panel);border-radius:20px;box-shadow:var(--sh);padding:20px}
.ch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.const svg{display:block;width:100%;height:auto}
.clg{animation:drift var(--d) ease-in-out infinite alternate;transform-box:fill-box}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
.dot{fill:var(--ink2);opacity:.38}
.dot.fr{fill:var(--accent);opacity:1;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.ping{fill:none;stroke:var(--accent);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out forwards}
@keyframes ping{from{transform:scale(.4);opacity:.95}to{transform:scale(3.4);opacity:0}}
.clhit{cursor:pointer}
.cll{font:600 12.5px var(--sans);fill:var(--ink)}
.cln{font:500 11.5px var(--sans);fill:var(--ink2)}
.cap{font-size:13.5px;color:var(--ink2);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.cap i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.clist{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.clist .h{font-weight:600;font-size:14px;margin-bottom:4px}
.lrow{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 0;cursor:pointer;font-size:15px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow small{color:var(--ink2);font-size:13px;white-space:nowrap}
.tick{list-style:none;margin:0;padding:0}
.tick li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.4}
.tick li:first-child{border-top:0}
.tick li.new{animation:in .5s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tick .k{flex:none;font-size:11.5px;font-weight:700;color:var(--ink2);min-width:58px;padding-top:2px}
.story{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:0}
.lead .kk{font-size:13px;font-weight:700;color:var(--accent)}
.lead h2{font-family:var(--serif);font-weight:500;font-size:clamp(25px,3.4vw,32px);line-height:1.15;letter-spacing:-.015em;margin:6px 0 8px}
.lead p{font-family:var(--serif);font-size:18px;color:var(--ink2);margin:0 0 10px}
.prov{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prov .ok{color:var(--ver);font-weight:600}
.more{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:620px){.more{grid-template-columns:repeat(3,1fr);gap:20px}}
.more .story{padding:14px 0;border-top:1px solid var(--line)}
@media (min-width:620px){.more .story{border-top:0;padding:0}}
.more h3{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.25;margin:4px 0 6px}
.more .kk{font-size:12.5px;font-weight:700;color:var(--ink2)}
.ask{padding:12px 0;border-top:1px solid var(--line)}
.ask:first-of-type{border-top:0;padding-top:2px}
.ask .q{font-family:var(--serif);font-size:18px;line-height:1.3}
.ask .who{font-size:13.5px;color:var(--ink2);margin-top:4px}
.ask .st{font-weight:600;color:var(--gap)}
.ask .st.done{color:var(--ver)}
.cov{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.cov .bar{height:8px;border-radius:999px;background:var(--panel2);position:relative;overflow:hidden}
.cov .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.cov .n{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
/* ---------- page ---------- */
.pg{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:1000px){.pg{grid-template-columns:minmax(0,1fr) 340px;gap:48px}}
.art{max-width:700px}
.citeb{background:var(--accb);border-radius:16px;padding:14px 16px;margin-bottom:22px;font-size:15px}
.citeb b{font-weight:600}
.kick{font-size:13px;font-weight:700;color:var(--ink2)}
.ttl{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5.5vw,48px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px}
.alive{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);font-weight:500}
.trust{background:var(--panel);border-radius:18px;box-shadow:var(--sh);padding:14px 16px;margin:18px 0 24px}
.tbar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px}
.tbar i{display:block;height:100%}
.tleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13.5px}
.tleg span{display:inline-flex;align-items:center;gap:6px}
.tleg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tmeta{font-size:13.5px;color:var(--ink2);margin-top:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tog{border:0;background:var(--panel2);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.art h2{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em;margin:36px 0 6px}
.art .note{font-size:14.5px;color:var(--ink2);margin:0 0 10px}
.blk{position:relative;padding:8px 12px 8px 18px;margin:0 -12px 4px -18px;border-radius:12px;cursor:pointer;transition:background .2s}
.blk::before{content:"";position:absolute;left:6px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--one);display:none}
.blk.mk::before{display:block}
.blk:hover{background:var(--panel)}
.blk.sel{background:var(--panel);box-shadow:var(--sh)}
.blk.cited{background:var(--accb)}
.blk.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{background:var(--verb)}100%{background:transparent}}
.blk p{font-family:var(--serif);font-size:19px;line-height:1.55;margin:0}

function ansHtml(){
 if(!S.ans)return '';var a=S.ans;
 var fl=S.ansIn;S.ansIn=false;return '<div class="ans'+(fl?' in':'')+'"><p>'+esc(a.t)+'</p>'+(a.cav?'<div class="cav">'+esc(a.cav)+'</div>':'')+(a.c.length?'<div class="cites">'+a.c.map(function(id){var b=B[id];return '<button class="cite" data-act="goblk" data-id="'+id+'"><i style="background:'+(isExc(b)?TCOL[b.tier]:'var(--ink2)')+'"></i>'+(b.tier==='one'?'Seen once: ':b.tier==='gap'?'Open question: ':'')+esc(b.text.split(/[.,]/)[0].slice(0,38))+'…</button>'}).join('')+'</div>':'')+'<button class="x" data-act="closeans" aria-label="Close">×</button></div>';
}
function ask(q){q=q.trim();if(!q)return;S.ans=answer(q);S.ansIn=true;renderFoot();if(S.view==='home'){var el=$('asking');if(el)el.innerHTML=askingHtml()}}

/* ---------- render ---------- */
var CHEV='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
function renderTop(){
 $('top').innerHTML=S.view==='home'?'<button class="wm" data-act="home"><b>Wikimind</b><span>Northwind</span></button><span class="sp"></span><span class="live"><span class="pdot"></span>Asoka is learning</span>':'<button class="back" data-act="home">'+CHEV+'Wikimind</button><span class="sp"></span><span class="live"><span class="pdot"></span>Live</span>';
}
function renderFoot(){
 $('ans').innerHTML=ansHtml();
 var c=S.view==='home'?['What changed this week?','Who approves a 30% discount in EMEA?','How do I get lunch reimbursed?']:({cite:['Can I get an extension?','Who approves my deal?','Why 14 days?'],change:['Which deals are affected?','Is this current?'],browse:['What breaks if I change the approval process?','How do you know this?','Is this current?'],demo:['How do you know this?','What are you unsure about?']})[S.mode];
 $('chips').innerHTML=c.map(function(x){return '<button class="chip" data-act="chip" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('');
}
function render(){renderTop();var m=$('main');m.className='wrap'+(S.entering?' enter':'');m.innerHTML=S.view==='home'?homeHtml():pageHtml();renderFoot();S.entering=false;S.flash=null}
var obsT=null;
function go(v,opt){
 opt=opt||{};S.entering=true;S.view=v;S.sel=null;S.why=null;S.diff=null;S.done={};S.show=null;S.gfocus=null;S.gsel=null;
 if(v==='page'){
  S.mode=opt.mode||'browse';S.cite=S.mode==='cite'?'b4':null;
  S.secs={cite:{rules:true},change:{how:true,hist:true},browse:{how:true,map:true},demo:{how:true,map:true,unw:true}}[S.mode];
  if(S.mode==='change')S.diff='b2';
  if(S.mode==='demo'||S.mode==='browse')S.blame=S.mode==='demo'?S.blame:false;
 }
 try{location.hash=v==='page'?'page-'+S.mode:v}catch(e){}
 render();window.scrollTo(0,0);
 clearTimeout(obsT);if(v==='page'&&S.mode==='browse'&&!S.updated)obsT=setTimeout(observe,20000);
}
function observe(){
 if(S.updated)return;S.updated=true;
 var b=B.b7;b.before=b.text;b.changed='Updated just now';b.tier='cor';b.text='Renewals with no price change skip approval on purpose. RevOps confirmed it’s been the policy since 2023, because flat renewals don’t change revenue risk.';
 b.prov.push({k:'ask',s:'Maria Okafor answered',w:'Just now',t:'“Yes, that’s on purpose. It’s been the policy since 2023.”'},{k:'think',s:'Asoka',w:'Just now',t:'The process owner confirmed it, so this is corroborated. Waiting for Dana to verify.'});
 b.fresh=true;S.asking[0].done=true;S.asking[0].when='answered just now';
 if(S.view==='page'){render();toast('Maria Okafor answered. Asoka updated a fact on this page.')}
 setTimeout(function(){b.fresh=false},2600);
}
setInterval(function(){
 var o=POOL[S.ti++%POOL.length];S.obs+=1+Math.floor(Math.random()*3);
 S.ticks.forEach(function(x){x.ago+=1});S.ticks.unshift({k:o.k,t:o.t,ago:0});S.ticks=S.ticks.slice(0,4);
 if(S.view==='home'){var t=$('tick');if(t)t.innerHTML=tickHtml(true);var ob=$('obs');if(ob){ob.textContent=S.obs.toLocaleString();ob.classList.remove('bump');void ob.offsetWidth;ob.classList.add('bump')}ping(o.c)}
},3800);

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
 if(a==='home')go('home');
 else if(a==='open')go('page');
 else if(a==='toask'){var ak=$('asking');if(ak)ak.parentNode.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})}
 else if(a==='openchg')go('page',{mode:'change'});
 else if(a==='mode')go('page',{mode:b.dataset.v});
 else if(a==='do')doAct(b.dataset.v);
 else if(a==='gfilter'){S.gfocus=b.dataset.v||null;S.gsel=null;S.flash='cap';render()}
 else if(a==='gnode'){S.gsel=S.gsel===b.dataset.id?null:b.dataset.id;S.flash='cap';render()}
 else if(a==='gclear'){S.gsel=null;S.gfocus=null;render()}
 else if(a==='cite')go('page',{mode:'cite'});
  else if(a==='stub')toast('Only “Opportunity approvals” is built in this prototype.');
 else if(a==='stub2')toast('In the product, this opens the Slack thread.');
 else if(a==='cluster'){var i=+b.dataset.i;S.cluster=S.cluster===i?null:i;render()}
 else if(a==='blk'){var bid=b.dataset.id;S.why=S.why===bid?null:bid;S.flash=S.why?'why-'+bid:null;render()}
 else if(a==='trail'){S.sel=b.dataset.id;render()}
 else if(a==='noop'){}
 else if(a==='diff'){S.diff=S.diff===b.dataset.id?null:b.dataset.id;S.flash=S.diff?'diff-'+S.diff:null;render()}
 else if(a==='unsel'){S.sel=null;render()}
 else if(a==='blame'){S.blame=!S.blame;render()}
 else if(a==='observe')observe();
 else if(a==='send'){var x=$('in').value;$('in').value='';ask(x)}
 else if(a==='chip')ask(b.dataset.v);
 else if(a==='closeans'){S.ans=null;renderFoot()}
 else if(a==='goblk'){var id=b.dataset.id;if(S.view!=='page')go('page',{scrollTo:id});S.why=id;render();setTimeout(function(){var el=$('blk-'+id);if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})},60)}
 else if(a==='askabout'){var bb=B[b.dataset.id],src=bb.prov.filter(function(p){return p.k!=='think'});S.ans={t:'I believe this because of '+src.length+' source'+(src.length===1?'':'s')+': '+src.map(function(p){return KIND[p.k][1].toLowerCase()+' ('+p.s+')'}).join(', ')+'.',cav:TIER[bb.tier][1],c:[b.dataset.id]};renderFoot()}
});
document.addEventListener('toggle',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.sec){S.secs[t.dataset.sec]=t.open;if(t.open){t.classList.remove('in');void t.offsetWidth;t.classList.add('in');setTimeout(function(){t.classList.remove('in')},400)}}},true);
window.addEventListener('scroll',function(){var hd=document.querySelector('header');if(hd)hd.classList.toggle('sc',window.scrollY>4)},{passive:true});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.id==='in'){e.preventDefault();var x=$('in').value;$('in').value='';ask(x);return}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('blk')){e.preventDefault();e.target.click()}
 if(e.key==='Escape'&&(S.sel||S.why)){if(S.sel)S.sel=null;else S.why=null;render()}
});
function fromHash(){var h=location.hash.slice(1);if(h==='home')return {v:'home'};var m=h.match(/^page(?:-(cite|change|browse|demo))?$/);if(m)return {v:'page',mode:m[1]||'browse'};return null}
window.addEventListener('hashchange',function(){var f=fromHash();if(!f)return;if(f.v==='home'&&S.view!=='home')go('home');else if(f.v==='page'&&(S.view!=='page'||S.mode!==f.mode))go('page',{mode:f.mode})});
var f0=fromHash();if(f0&&f0.v==='page')go('page',{mode:f0.mode});else{S.entering=true;render()}
})();
</script>
</body>
</html>
