<style>
:root{
 --bg:#F4F5F2;--panel:#FFFFFF;--panel2:#EEF1EC;--ink:#1E2724;--ink2:#5E6A65;--line:#E3E7E2;--accent:#4353C6;--ub:#E9ECFB;
 --ok:#1E8467;--okb:#E1F3EC;--warn:#B06E12;--warnb:#FCF0DA;--bad:#C2423B;--badb:#FBE6E3;
 --iris-bg:#E8EBFC;--iris-fg:#4353C6;--sol-bg:#DFF3EC;--sol-fg:#1E8467;--fen-bg:#FCEFD8;--fen-fg:#A86A12;--pia-bg:#FBE6EF;--pia-fg:#B2457A;
 --sh:0 1px 2px rgba(25,40,32,.05),0 6px 20px rgba(25,40,32,.06);
 --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#121614;--panel:#1B201E;--panel2:#232A27;--ink:#ECEFEC;--ink2:#A1ACA7;--line:#2C3431;--accent:#9EA9FF;--ub:#262C52;
  --ok:#6FD3B4;--okb:#16362D;--warn:#F0C36B;--warnb:#3D3016;--bad:#FF9A92;--badb:#44221F;
  --iris-bg:#262C52;--iris-fg:#AEB8FF;--sol-bg:#16362D;--sol-fg:#6FD3B4;--fen-bg:#3D3016;--fen-fg:#F0C36B;--pia-bg:#43202F;--pia-fg:#F2A6C6;
  --sh:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
 }
}
:root[data-theme="dark"]{
 --bg:#121614;--panel:#1B201E;--panel2:#232A27;--ink:#ECEFEC;--ink2:#A1ACA7;--line:#2C3431;--accent:#9EA9FF;--ub:#262C52;
 --ok:#6FD3B4;--okb:#16362D;--warn:#F0C36B;--warnb:#3D3016;--bad:#FF9A92;--badb:#44221F;
 --iris-bg:#262C52;--iris-fg:#AEB8FF;--sol-bg:#16362D;--sol-fg:#6FD3B4;--fen-bg:#3D3016;--fen-fg:#F0C36B;--pia-bg:#43202F;--pia-fg:#F2A6C6;

*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em}
.sp{flex:1}
button{font:inherit;color:inherit}
.btn{border:0;background:var(--panel2);border-radius:999px;padding:9px 18px;min-height:40px;font-weight:600;font-size:14.5px;cursor:pointer}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--ink);color:var(--panel)}
.btn.pri:hover{opacity:.9}
.btn.stop{background:var(--badb);color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 14px;font-size:13.5px}
.lnk{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 2px;font-size:14.5px}
.back{background:none;border:0;font-weight:600;font-size:15.5px;cursor:pointer;padding:6px 2px;display:flex;align-items:center;gap:4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:6px 0 170px}
.greet{padding:12px 0 6px}
.greet h1{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.15;margin:0}
.greet p{color:var(--ink2);font-size:17px;margin:6px 0 0}
h2{font-size:17px;font-weight:600;margin:30px 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h2 .n{font-size:13px;font-weight:600;color:var(--ink2)}
.card{background:var(--panel);border-radius:20px;box-shadow:var(--sh);padding:18px;margin-bottom:12px}
.kick{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:8px}
.t{font-weight:600;font-size:17.5px;letter-spacing:-.01em;line-height:1.35}
.w{color:var(--ink2);font-size:15.5px;margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.empty{color:var(--ink2);background:var(--panel);border-radius:20px;padding:20px;text-align:center;box-shadow:var(--sh)}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:0;border-radius:18px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.row .x{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:17px}
.row .rl{color:var(--ink2);font-size:14px;font-weight:500}
.row .ln{color:var(--ink2);font-size:14.5px;margin-top:2px}
.chev{color:var(--ink2);flex:none}
.avw{position:relative;display:inline-block;line-height:0;flex:none}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
.dg{background:var(--ok)}.da{background:var(--warn)}.dr{background:var(--bad)}.dx{box-shadow:inset 0 0 0 1.5px var(--ink2);opacity:.6}
.ahead{padding:10px 0 4px}
.ahead .r1{display:flex;gap:14px;align-items:center}
.ahead h1{font-size:30px;font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.1}
.ahead .rl{color:var(--ink2);font-size:14.5px;display:flex;gap:8px;align-items:center;margin-top:2px}
.ai{font-size:12px;background:var(--panel2);border-radius:999px;padding:1px 9px}
.ahead p{color:var(--ink2);margin:12px 0 0;font-size:16px}
.grp{margin-top:26px}
.grp h3{font-size:14px;font-weight:600;color:var(--ink2);margin:0 0 10px 4px}
.cls{background:var(--panel);border-radius:18px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.ch{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer}
.ch .l1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%}
.ch .nm{font-weight:600;font-size:16.5px}
.ch .pc{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.ch .pc.lo{color:var(--warn)}
.ch .sc{color:var(--ink2);font-size:14.5px}
.cx{padding:0 16px 16px}
.cx .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:2px 0 10px}
.cx .lg span{display:inline-flex;align-items:center;gap:5px}
.cx .lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.cx .sub{font-size:13.5px;font-weight:600;color:var(--ink2);margin:14px 0 4px}
.cx ul{margin:0;padding-left:18px;font-size:15px}
.ex{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:0;border-radius:12px;padding:10px 12px;margin-top:6px;cursor:pointer;font-size:15px}
.ex .x{flex:1}
.ex small{color:var(--ink2);font-size:13px}
.lock{color:var(--ink2);font-size:14.5px;margin-top:4px}
.thead{padding:10px 0 2px}
.thead .k{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:600}
.thead h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:8px 0 2px;line-height:1.2}
.thead .st{font-size:14.5px;color:var(--ink2)}
.tl{list-style:none;margin:6px 0 0 8px;padding:0 0 0 20px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 4px;font-size:15.5px}
.tl li::before{content:"";position:absolute;left:-28px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px var(--ink2)}
.tl li:last-child{padding-bottom:2px}
.tl li.ok::before{box-shadow:inset 0 0 0 2px var(--ok)}
.tl li.you::before{background:var(--accent);box-shadow:none}
.whyb{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:0;border-radius:14px;padding:12px 14px;cursor:pointer;margin-top:10px}
.whyb .x{flex:1;font-size:15px}
.whyb b{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:left;border:0;background:var(--panel2);border-radius:14px;padding:12px 14px;font-weight:500;cursor:pointer}
.opt.on{background:var(--ub);color:var(--accent);font-weight:600}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel2);border:0;border-radius:14px;padding:12px 14px;margin-top:10px}
.sug{display:inline-block;border:0;background:var(--ub);color:var(--accent);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;margin-top:8px;cursor:pointer}
.gen{background:var(--ub);border-radius:16px;padding:14px 16px;margin-top:12px}
.gen .t{font-size:16.5px}
.gen .w{color:var(--ink)}
.done{display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:600;font-size:15px;margin-top:4px}
footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.reply{background:var(--panel);border-radius:18px;box-shadow:var(--sh);padding:14px 44px 14px 16px;margin-bottom:10px;position:relative;font-size:15.5px}
.reply .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:var(--panel2);cursor:pointer;font-size:16px;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:0;background:var(--panel);box-shadow:var(--sh);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:500;cursor:pointer}
.bar{display:flex;gap:8px;padding-bottom:12px}
.bar input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:0;box-shadow:var(--sh);border-radius:25px;padding:0 20px;height:50px}
.ic{width:50px;height:50px;border-radius:50%;border:0;box-shadow:var(--sh);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ic.go{background:var(--ink);color:var(--panel)}
.ic.on{background:var(--bad);color:#fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:999px;font-size:14.5px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .15s;z-index:30;box-shadow:var(--sh)}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

<main class="wrap" id="main"></main>

 <div class="wrap">

 </div>
</footer>

function avatar(a,sz){
 var rc=a.paused?'var(--bad)':needsOf(a).length?'var(--warn)':'var(--ok)';
 return '<span class="avw" aria-hidden="true"><svg viewBox="0 0 64 64" width="'+sz+'" height="'+sz+'"><circle cx="32" cy="32" r="30" fill="none" stroke="'+rc+'" stroke-width="2"/><rect x="7" y="7" width="50" height="50" rx="17" fill="var(--'+a.id+'-bg)"/>'+glyph(a.id)+'</svg></span>';
}
function dots(d){return d?'<span class="dots" aria-hidden="true">'+d.split('').map(function(c){return '<i class="d'+c+'"></i>'}).join('')+'</span>':''}
var CHEV='<svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var BACK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';

/* ---------- home ---------- */
function needCard(n){
 var a=ag(n.agent),h='<div class="card">';
 if(n.type==='spot'){
  var t=tr(n.trace),c=cl(t.cls);
  h+='<div class="kick">'+avatar(a,26)+'Spot check from '+a.name+'</div><div class="t">Was this right? '+esc(t.title)+'</div><div class="w">One of '+c.week+' '+c.name.toLowerCase()+' '+a.name+' did on its own this week. Checking a few keeps it honest.</div><div class="btns"><button class="btn pri" data-act="go" data-v="trace-'+t.id+'">Review it</button><button class="btn" data-act="skip" data-v="'+n.id+'">Skip</button></div>';
 }else if(n.type==='hand'){
  var k=cl(n.cls);
  h+='<div class="kick">'+avatar(a,26)+a.name+' is ready for more</div><div class="t">Let '+a.name+' handle '+k.name.toLowerCase()+' on its own?</div><div class="w">'+k.a[0]+' of the last '+k.a[1]+' matched your call. None were reversed.</div><div style="margin-top:10px">'+dots(k.dots)+'</div>';
  h+=n.sent?'<div class="w" style="margin-top:12px;color:var(--ink)">Sent to Dev for a second OK.</div>':'<div class="btns"><button class="btn pri" data-act="hand" data-v="'+n.id+'">Hand it over</button><button class="btn" data-act="skip" data-v="'+n.id+'">Not yet</button></div>';
 }else{
  h+='<div class="kick">'+avatar(a,26)+'Fen is holding a payment</div><div class="t">Confirm Acme’s new bank details?</div><div class="w">The $4,200 invoice matches its PO, but Acme’s bank account changed 2 days ago. Only confirm if you or Acme verified it by phone.</div><div class="btns"><button class="btn pri" data-act="bank" data-v="yes">I verified it</button><button class="btn" data-act="bank" data-v="no">Keep holding</button></div>';
 }
 return h+'</div>';
}
function homeHtml(){
 var hr=new Date().getHours(),gw=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
 var allP=AG.every(function(a){return a.paused}),n=S.needs.length;
 var line=allP?'Everyone is paused. Resume when you’re ready.':n?(n===1?'One thing needs you':n+' things need you')+'. Everything else is handled.':'Nothing needs you. The team has it.';
 var h='<section class="greet"><h1>'+gw+', Priya</h1><p>'+line+'</p></section>';
 h+='<h2>Needs you'+(n?' <span class="n">'+n+'</span>':'')+'</h2>';
 h+=n?S.needs.map(needCard).join(''):'<div class="empty">You’re all caught up.</div>';
 h+='<h2>Your team</h2>';
 AG.forEach(function(a){
  var nn=needsOf(a).length,ln=a.paused?'Paused.':(nn?(nn===1?'1 thing needs you. ':nn+' things need you. '):'')+'Handled '+a.today+' today, agrees with you '+agree(a)+'% of the time.';
  h+='<button class="row" data-act="go" data-v="'+a.id+'">'+avatar(a,46)+'<span class="x"><span class="nm">'+a.name+'</span> <span class="rl">'+a.role+'</span><div class="ln">'+esc(ln)+'</div></span>'+CHEV+'</button>';
 });
 return h;
}

/* ---------- agent ---------- */
function clsHtml(c){
 var p=pct(c),open=S.open===c.id,h='<div class="cls"><button class="ch" data-act="cls" data-v="'+c.id+'" aria-expanded="'+open+'"><span class="l1"><span class="nm">'+esc(c.name)+'</span>'+(p===null?'':'<span class="pc'+(p<95?' lo':'')+'">'+p+'%</span>')+'</span><span class="sc">'+esc(c.scope)+'</span>'+(c.dots?dots(c.dots):'')+'</button>';
 if(open){
  h+='<div class="cx">';
  if(c.lvl==='never')h+='<div class="lock">This one always comes to you. It’s a hard rule, so it can’t be handed over.</div>';
  else{
   h+='<div class="lg"><span><i class="dg"></i>Matched your call</span><span><i class="da"></i>You edited it</span><span><i class="dr"></i>Reversed</span><span><i class="dx"></i>Not reviewed</span></div>';
   h+='<div class="w" style="color:var(--ink)">'+c.a[0]+' of '+c.a[1]+' decisions matched what you’d have done. '+c.week+' this week.</div>';
  }
  if(c.rules.length)h+='<div class="sub">Always</div><ul>'+c.rules.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ul>';
  if(c.ex.length){h+='<div class="sub">Recent work</div>'+c.ex.map(function(id){var t=tr(id);return '<button class="ex" data-act="go" data-v="trace-'+t.id+'"><span class="x">'+esc(t.title)+'<br><small>'+esc(t.when)+(t.rv?(t.rv==='ok'?', reviewed':', corrected by you'):'')+'</small></span>'+CHEV+'</button>'}).join('')}
  if(c.lvl==='alone')h+='<div class="btns"><button class="btn" data-act="takeback" data-v="'+c.id+'">Take it back</button></div>';
  else if(c.lvl==='asks')h+=c.ready?'<div class="btns"><button class="btn pri" data-act="handc" data-v="'+c.id+'">Hand it over</button></div>':'<div class="w" style="margin-top:12px;font-size:14.5px">'+esc(c.need||'Needs more decisions first.')+'</div>';
  h+='</div>';
 }
 return h+'</div>';
}
function agentHtml(a){
 var mine=CL.filter(function(c){return c.agent===a.id}),al=mine.filter(function(c){return c.lvl==='alone'}),as=mine.filter(function(c){return c.lvl==='asks'}),nv=mine.filter(function(c){return c.lvl==='never'});
 var h='<section class="ahead"><div class="r1">'+avatar(a,72)+'<div><h1>'+a.name+'</h1><div class="rl">'+a.role+'<span class="ai">AI agent</span></div></div></div>';
 h+='<p>'+(a.paused?'Paused. Nothing runs until you resume.':'Handles '+al.length+' kind'+(al.length===1?'':'s')+' of work on its own and asks you about '+as.length+'. Agrees with you '+agree(a)+'% of the time.')+'</p></section>';
 if(al.length)h+='<div class="grp"><h3>Handles on its own</h3>'+al.map(clsHtml).join('')+'</div>';
 if(as.length)h+='<div class="grp"><h3>Asks you first</h3>'+as.map(clsHtml).join('')+'</div>';
 if(nv.length)h+='<div class="grp"><h3>Always yours</h3>'+nv.map(clsHtml).join('')+'</div>';
 h+='<div class="btns" style="margin-top:22px"><button class="btn'+(a.paused?'':' stop')+'" data-act="pause" data-v="'+a.id+'">'+(a.paused?'Resume ':'Pause ')+a.name+'</button></div>';
 return h;
}

/* ---------- trace ---------- */
var REASONS=['It should have asked me','Wrong person or target','The steps were wrong','It shouldn’t have happened'];
function traceHtml(t){
 var a=ag(t.agent),c=cl(t.cls),p=pct(c);
 var h='<section class="thead"><div class="k">'+avatar(a,26)+a.name+', '+esc(t.when)+'</div><h1>'+esc(t.title)+'</h1><div class="st">'+esc(t.status)+(t.undone?'. Undone by you.':'')+'</div></section>';
 h+='<div class="card" style="margin-top:14px"><ol class="tl">'+t.steps.map(function(s){return '<li class="'+s[1]+'">'+esc(s[0])+'</li>'}).join('')+'</ol>';
 h+='<button class="whyb" data-act="tocls" data-v="'+c.id+'"><span class="x"><b>'+esc(c.name)+'</b>: '+(c.lvl==='alone'?'handles on its own':c.lvl==='asks'?'asks you first':'always yours')+(p===null?'':'. Matched your call '+c.a[0]+' of '+c.a[1]+' times.')+'</span>'+CHEV+'</button>';
 h+='</div>';
 h+=reviewHtml(t);
 if(t.rev&&!t.undone&&/^Done|^Scheduled/.test(t.status))h+='<div class="btns" style="margin-top:4px"><button class="lnk" data-act="undo" data-v="'+t.id+'">Undo this</button></div>';
 return h;
}
function reviewHtml(t){
 var a=ag(t.agent),h='<div class="card">';
 if(t.rv==='ok')return h+'<div class="done">✓ You confirmed this was right.</div></div>';
 if(t.rv==='fixed')return h+'<div class="done">✓ Corrected. '+esc(t.fixMsg)+'</div>'+(t.fixCls?'<div class="btns"><button class="lnk" data-act="tocls" data-v="'+t.fixCls+'">See the new rule</button></div>':'')+'</div>';
 if(t.rv==='once')return h+'<div class="done">✓ Noted as a one-off. '+a.name+' won’t change its approach.</div></div>';
 var R=t.rr||{};
 if(!R.stage){
  return h+'<div class="t">Was this right?</div><div class="w">Your answer teaches '+a.name+'. It’s the fastest way to shape how it works.</div><div class="btns"><button class="btn pri" data-act="rvok" data-v="'+t.id+'">Yes, that’s right</button><button class="btn" data-act="rvno" data-v="'+t.id+'">Not quite</button></div></div>';
 }
 if(R.stage==='reason'){
  return h+'<div class="t">What was off?</div><div class="opts">'+REASONS.map(function(r,i){return '<button class="opt" data-act="reason" data-v="'+t.id+'" data-i="'+i+'">'+r+'</button>'}).join('')+'</div></div>';
 }
 if(R.stage==='why'){
  var sg=t.gen?t.gen.reason:'This case was different';
  return h+'<div class="t">'+REASONS[R.reason]+'. What made this case different?</div><div class="w">One line is enough. '+a.name+' will look for others like it.</div><input class="inp" id="why" type="text" value="'+esc(R.why||'')+'" placeholder="For example: '+esc(sg)+'" aria-label="What made it different"><button class="sug" data-act="sug" data-v="'+t.id+'">'+esc(sg)+'</button><div class="btns"><button class="btn pri" data-act="whygo" data-v="'+t.id+'">Continue</button></div></div>';
 }
 var g=genOf(t),newL=R.reason===3?'won’t happen without you':'will ask you first';
 return h+'<div class="t">Here’s what '+a.name+' would change</div><div class="gen"><div class="t">From now on, '+esc(g.name.charAt(0).toLowerCase()+g.name.slice(1))+' '+newL+'.</div><div class="w" style="margin-top:6px">Because: “'+esc(R.why)+'”</div><div class="w" style="margin-top:6px">Last month this would have changed '+g.affected.length+' of '+g.of+' decisions: '+esc(g.affected.join(', '))+'.</div></div><div class="btns"><button class="btn pri" data-act="genok" data-v="'+t.id+'">Apply</button><button class="btn" data-act="once" data-v="'+t.id+'">Just this once</button></div></div>';
}
function genOf(t){
 if(t.gen)return t.gen;
 var c=cl(t.cls);
 return {name:c.name+' like this one',scope:'Cases like this one ask you first.',affected:[t.title.split(' ').slice(-1)[0]],of:c.week};
}

/* ---------- render ---------- */
function render(){
 var top='';
 if(S.view==='home')top='<span class="brand">Warden</span><span class="sp"></span>';
 else{
  var back='home',lab='Home';
  if(S.view.indexOf('trace-')===0){var t=tr(S.view.slice(6));if(t){back=t.agent;lab=ag(t.agent).name}}
  top='<button class="back" data-act="go" data-v="'+back+'">'+BACK+lab+'</button><span class="sp"></span>';
 }
 var allP=AG.every(function(a){return a.paused});
 top+='<button class="btn sm '+(allP?'':'stop')+'" data-act="stopall">'+(allP?'Resume all':'Stop all')+'</button>';
 $('top').innerHTML=top;
 var main;
 if(S.view==='home')main=homeHtml();
 else if(S.view.indexOf('trace-')===0){var tt=tr(S.view.slice(6));main=tt?traceHtml(tt):'<p class="w">That work isn’t here.</p>'}
 else main=agentHtml(ag(S.view));
 $('main').innerHTML=main;
 $('reply').innerHTML=S.reply?'<div class="reply">'+esc(S.reply)+'<button class="x" data-act="rclose" aria-label="Close">×</button></div>':'';
 var c=S.view==='home'?['Catch me up','Find j.park','Pause everyone']:S.view.indexOf('trace-')===0?['Catch me up','Find m.chen']:['Catch me up'];
 $('chips').innerHTML=c.map(function(x){return '<button class="chip" data-act="chip" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('');
}
function go(v){S.view=v;S.reply=null;if(ag(v)&&S.openKeep!==true)S.open=null;S.openKeep=false;try{location.hash=v}catch(e){}render();window.scrollTo(0,0)}

/* ---------- actions ---------- */
function addDot(c,ch){c.dots=(c.dots+ch).slice(-20);c.a[1]++;if(ch==='g')c.a[0]++}
function removeNeed(id){S.needs=S.needs.filter(function(n){return n.id!==id})}
function spotDone(t){S.needs=S.needs.filter(function(n){return !(n.type==='spot'&&n.trace===t.id)})}
function handOver(c,needId){
 var a=ag(c.agent);
 if(needId){var n=S.needs.filter(function(x){return x.id===needId})[0];if(n)n.sent=true}
 toast('Sent to Dev for a second OK.');render();
 setTimeout(function(){c.lvl='alone';c.ready=false;if(needId)removeNeed(needId);toast('Dev approved. '+a.name+' now handles '+c.name.toLowerCase()+' on its own.');render()},2200);
}
function pauseAll(){AG.forEach(function(a){a.paused=true});S.reply='Everyone is paused. Nothing runs until you resume.';render()}
function resumeAll(){
 if(!AG.some(function(a){return a.paused})){S.reply='Everyone is already working.';render();return}
 S.reply='Resuming the whole team needs a second person. I’ve asked Dev.';render();
 setTimeout(function(){AG.forEach(function(a){a.paused=false});S.reply='Dev confirmed. Everyone is back.';render()},2200);
}
var STOP=['find','show','what','who','did','the','why','with','for','and','about','open','where'];
function handle(raw){
 var t=raw.trim();if(!t)return;var l=t.toLowerCase();
 if(/\b(stop|pause)\b/.test(l)){pauseAll();return}
 if(/\bresume\b/.test(l)){resumeAll();return}
 if(/catch me up|today|summary|what did|how('s| is| are)/.test(l)){
  var n=S.needs.length;
  S.reply='Since yesterday the team handled 64 things: 61 on their own and 3 with your yes. Nothing was reversed. '+(n?(n===1?'One thing needs you.':n+' things need you.'):'Nothing needs you.');render();return;
 }
 for(var i=0;i<AG.length;i++){if(AG[i].re.test(t)&&!/find|why/.test(l)){go(AG[i].id);return}}
 var toks=l.split(/[^a-z0-9.’']+/).filter(function(w){return w.length>=3&&STOP.indexOf(w)<0});
 for(var j=0;j<toks.length;j++){
  var w=toks[j];
  var hit=T.filter(function(x){return x.title.toLowerCase().indexOf(w)>=0||x.steps.some(function(s){return s[0].toLowerCase().indexOf(w)>=0})})[0];
  if(hit){go('trace-'+hit.id);return}
  var ch=CL.filter(function(x){return x.name.toLowerCase().indexOf(w)>=0})[0];
  if(ch){S.open=ch.id;S.openKeep=true;go(ch.agent);return}
 }
 S.reply='I can catch you up, find any piece of work (try “j.park”), open a teammate, or pause everyone.';render();
}

var rec=null;
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act,v=b.dataset.v,t;
 if(a==='go')go(v);
 else if(a==='send'){var x=$('in').value;$('in').value='';handle(x)}
 else if(a==='chip')handle(v);
 else if(a==='rclose'){S.reply=null;render()}
 else if(a==='stopall'){AG.every(function(z){return z.paused})?resumeAll():pauseAll()}
 else if(a==='pause'){var g=ag(v);g.paused=!g.paused;toast(g.paused?g.name+' is paused.':g.name+' is back.');render()}
 else if(a==='skip'){removeNeed(v);toast('Okay. It’ll come back later if it still matters.');render()}
 else if(a==='hand'){var n=S.needs.filter(function(z){return z.id===v})[0];handOver(cl(n.cls),v)}
 else if(a==='handc'){var c=cl(v);S.needs=S.needs.filter(function(z){return !(z.type==='hand'&&z.cls===v)});handOver(c,null)}
 else if(a==='takeback'){var c2=cl(v);c2.lvl='asks';c2.ready=true;toast(ag(c2.agent).name+' will ask you about '+c2.name.toLowerCase()+' again.');render()}
 else if(a==='bank'){S.needs=S.needs.filter(function(z){return z.type!=='ask'});toast(v==='yes'?'Fen paid Acme. Your check is on record.':'Fen keeps holding it.');render()}
 else if(a==='cls'){S.open=S.open===v?null:v;render()}
 else if(a==='tocls'){var c3=cl(v);S.open=v;S.openKeep=true;go(c3.agent)}
 else if(a==='rvok'){t=tr(v);t.rv='ok';addDot(cl(t.cls),'g');spotDone(t);toast('Thanks. That counts as evidence for '+cl(t.cls).name.toLowerCase()+'.');render()}
 else if(a==='rvno'){t=tr(v);t.rr={stage:'reason'};render()}
 else if(a==='reason'){t=tr(v);t.rr={stage:'why',reason:+b.dataset.i};render();setTimeout(function(){var el=$('why');if(el)el.focus()},50)}
 else if(a==='sug'){t=tr(v);var el=$('why');if(el)el.value=t.gen?t.gen.reason:'This case was different'}
 else if(a==='whygo'){t=tr(v);var w=($('why')&&$('why').value.trim())||'';if(!w){toast('Add a few words, or tap the suggestion.');return}t.rr.why=w;t.rr.stage='gen';render()}
 else if(a==='genok'){
  t=tr(v);var g2=genOf(t),pc=cl(t.cls),ag2=ag(t.agent),id='c'+(++uid);
  CL.push({id:id,agent:t.agent,name:g2.name,scope:g2.scope,lvl:'asks',a:[0,0],dots:'',week:0,need:'New. Learned from your correction on '+t.title.toLowerCase()+'.',rules:[],ex:[t.id]});
  if(g2.parent)pc.scope=g2.parent;
  addDot(pc,'r');t.rv='fixed';t.fixCls=id;t.fixMsg=ag2.name+' will ask you about '+g2.name.toLowerCase()+' from now on.';spotDone(t);
  toast('Applied. Narrowing takes effect right away.');render();
 }
 else if(a==='once'){t=tr(v);t.rv='once';addDot(cl(t.cls),'r');spotDone(t);render()}
 else if(a==='undo'){t=tr(v);t.undone=true;t.steps.push(['You undid it. Every change was rolled back.','you']);toast('Undone. The record keeps both.');render()}
 else if(a==='mic'){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice isn’t available in this view. Type instead.');return}
  if(rec){rec.stop();return}
  try{rec=new SR();rec.lang='en-US';rec.onresult=function(ev){handle(ev.results[0][0].transcript)};rec.onerror=function(){toast('Couldn’t hear that.')};rec.onend=function(){rec=null;$('mic').classList.remove('on')};rec.start();$('mic').classList.add('on')}catch(x){rec=null;toast('Microphone is blocked here.')}
 }
});
$('in').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var x=$('in').value;$('in').value='';handle(x)}});
function fromHash(){var h=location.hash.slice(1);if(h==='home'||ag(h)||(h.indexOf('trace-')===0&&tr(h.slice(6))))return h;return null}
window.addEventListener('hashchange',function(){var h=fromHash();if(h&&h!==S.view){S.view=h;render();window.scrollTo(0,0)}});
var h0=fromHash();if(h0)S.view=h0;
render();
})();
</script>
</body>
</html>
